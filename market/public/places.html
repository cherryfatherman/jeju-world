<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주여행 · 섬업</title>
<meta name="description" content="제주 관광지·카페·맛집을 추천순으로. 도민과 여행자가 직접 추천하고 고쳐 가는 제주 도감.">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap" style="max-width:860px">
  <div class="page-title"><h1 id="pageH1">관광지</h1><p id="pageSub"></p></div>
  <div class="typetabs" id="typetabs"><button data-t="spot">관광지</button><button data-t="cafe">카페</button><button data-t="food">맛집</button></div>
  <div class="chips" id="areaChips"></div>
  <div class="listbar"><span id="count"></span><div class="sort" id="sort"><button data-s="votes" class="on">추천순</button><button data-s="new">최신순</button></div></div>
  <div class="rlist" id="list"></div>
  <p class="note" style="margin-top:16px">틀린 정보는 장소 페이지에서 알려 주세요. <span id="updated"></span></p>
  <section id="sec-tour" hidden>
    <div class="sec-head"><h2>제주 관광지 정보</h2><span class="more"></span></div>
    <div class="list"></div>
    <button type="button" class="btn itsmore" style="margin-top:12px" hidden>전체 보기</button>
    <p class="note" style="margin-top:10px"></p>
  </section>
</main>
<script>
const Q = new URLSearchParams(location.search);
let type = ['spot', 'cafe', 'food'].includes(Q.get('type')) ? Q.get('type') : 'spot', sort = 'votes', area = '전체', all = [];
const SUB = { spot: '추천 많은 관광지.', cafe: '추천 많은 카페 동네.', food: '추천 많은 맛집 거리.' };
function render() {
  $$('#typetabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === type));
  $('#pageH1').textContent = PLACE_LABEL[type]; $('#pageSub').textContent = SUB[type]; document.title = `${PLACE_LABEL[type]} · 섬업`;
  const mine = all.filter((p) => p.type === type);
  const areas = ['전체', ...new Set(mine.map((p) => (p.area || '').split(/[· ]/)[0]).filter(Boolean))];
  if (!areas.includes(area)) area = '전체';
  $('#areaChips').replaceChildren(...areas.map((a) => { const b = document.createElement('button'); b.className = 'chip' + (a === area ? ' on' : ''); b.textContent = a; b.onclick = () => { area = a; render(); }; return b; }));
  let list = mine.filter((p) => area === '전체' || (p.area || '').startsWith(area));
  list = sort === 'votes' ? list.sort((a, b) => (b.votes || 0) - (a.votes || 0)) : list.sort((a, b) => (b.lastChecked || '').localeCompare(a.lastChecked || ''));
  $('#count').textContent = `${list.length}곳`;
  $('#list').replaceChildren(...list.map((p, i) => rankRow({ rank: i + 1, href: `./place.html?id=${encodeURIComponent(p.id)}`, image: p.image, title: p.name, sub: p.summary, meta: [p.area, ...(p.tags || []).slice(0, 2), p.comments ? `이야기 ${p.comments}` : ''].filter(Boolean).join(' · '), kind: 'place', id: p.id, votes: p.votes })));
  if (!list.length) $('#list').innerHTML = '<div class="empty">아직 등록된 곳이 없어요.</div>';
}
const TOUR_H = { spot: '제주 관광지 정보', cafe: '제주 카페 정보', food: '제주 맛집 정보' };
function drawTour() { const sec = $('#sec-tour'); sec.querySelector('h2').textContent = TOUR_H[type]; itsSection(sec, 'tour', { first: 12, cat: type }); }
$$('#typetabs button').forEach((b) => b.onclick = () => { type = b.dataset.t; history.replaceState(null, '', `?type=${type}`); render(); drawTour(); });
$$('#sort button').forEach((b) => b.onclick = () => { sort = b.dataset.s; $$('#sort button').forEach((x) => x.classList.toggle('on', x === b)); render(); });
mountShell({ active: 'jeju', sub: 'travel' }).then(async () => {
  drawTour();
  const d = await api('/api/places'); all = d.items || []; render();
  if (d.updatedAt) $('#updated').textContent = `데이터 갱신: ${new Date(d.updatedAt).toLocaleString('ko-KR')}`;
});
</script>
</body>
</html>
