<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수상작 도감 · 탐라도감</title>
<meta name="description" content="해외 해커톤 수상작 수백 개를 분야별로 모았어요. 한국에서 해볼 만한 아이디어의 출발점.">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap">
  <div class="page-title"><h1>수상작 <em>도감</em></h1><p>해외 해커톤에서 상을 받은 프로젝트들이에요. "이런 불편을 이렇게 풀었구나"를 보고, 한국판·제주판을 만들어 보세요. 출처: Devpost.</p></div>
  <div class="search"><input id="q" placeholder="검색: restaurant, elderly, travel, 교육…"><button class="btn" id="shuffle">아무거나</button></div>
  <div class="chips" id="chips"></div>
  <div class="sec-head"><span class="more" id="count"></span></div>
  <div class="list" id="list"></div>
  <div style="text-align:center;margin-top:16px"><button class="btn" id="more">더 보기</button></div>
</main>
<script>
mountShell({ active: 'winners', primary: 'project' });
let all = [], cat = '전체', q = '', shown = 40;
const EMOJI = { '헬스·웰빙': '🩺', '교육': '📚', '지역·로컬': '🏘️', '커머스·소상공인': '🛍️', '생산성·업무': '🧑‍💻', '환경·농업': '🌱', '여행·관광': '✈️', '미디어·크리에이터': '🎬', '부동산·주거': '🏠', '기타': '🧩' };
function filtered() {
  const s = q.trim().toLowerCase();
  return all.filter((w) => (cat === '전체' || w.category === cat) && (!s || (w.name + ' ' + w.tagline + ' ' + w.themes.join(' ')).toLowerCase().includes(s)));
}
function render() {
  const list = filtered();
  $('#count').textContent = `${list.length}개 · 좋아요 많은 순`;
  $('#list').replaceChildren(...list.slice(0, shown).map((w) => { const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = `<div class="body"><b>${esc(w.name)}</b><p>${esc(w.tagline)}</p><div class="meta" style="margin-top:6px"><span class="badge">${esc(w.category)}</span>${w.themes.map((t) => `<span class="badge">#${esc(t)}</span>`).join('')}</div></div><div class="right"><span class="pill">추천 ${w.likes}</span><a class="btn sm" href="${esc(w.url)}" target="_blank" rel="noopener">원문</a></div>`; return d; }));
  $('#more').style.display = list.length > shown ? '' : 'none';
}
async function load() {
  all = await api('/api/winners');
  const cats = ['전체', ...Object.keys(EMOJI).filter((c) => all.some((w) => w.category === c))];
  $('#chips').replaceChildren(...cats.map((c) => { const b = document.createElement('button'); b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c; b.onclick = () => { cat = c; shown = 40; $$('.chip').forEach((x) => x.classList.toggle('on', x === b)); render(); }; return b; }));
  render();
}
$('#q').oninput = (e) => { q = e.target.value; shown = 40; render(); };
$('#more').onclick = () => { shown += 40; render(); };
$('#shuffle').onclick = () => { const l = filtered(); if (!l.length) return; const w = l[Math.floor(Math.random() * l.length)]; q = w.name; $('#q').value = q; render(); };
load();
</script>
</body>
</html>
