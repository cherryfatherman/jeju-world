<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>창업정보 · 섬업</title>
<meta name="description" content="제주에서 받을 수 있는 창업 지원사업·자금과, 창업 인사이트(논문·통계·정책)를 추천순으로.">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap" style="max-width:860px">
  <div class="page-title"><h1 id="pageH1"></h1><p id="pageSub"></p></div>
  <div class="listbar" style="margin-top:16px"><div class="stabs" id="stabs" hidden></div><div class="sort" id="sort"><button data-s="votes" class="on">업순</button><button data-s="new">최신순</button></div></div>
  <div class="chips" id="chips"></div>
  <div class="rlist" id="list"></div>
  <p class="note" id="foot" style="margin-top:16px"></p>
</main>
<script>
const kind = new URLSearchParams(location.search).get('kind') === 'insight' ? 'insight' : 'program';
const T = {
  program: { h1: '창업정보', sub: '제주에서 받을 수 있는 지원사업과 자금. 많이 업 받은 순서예요.', chip: (p) => p.region || '전국', row: programRow, foot: '기간이 지난 공고는 완료로 옮겨져요. 완료된 글에도 업과 이야기를 남길 수 있어요.' },
  insight: { h1: '인사이트', sub: '창업에 도움이 되는 논문·통계·정책·읽을거리. 출처를 눌러 원문을 확인하세요.', chip: (p) => p.category || '기타', row: insightRow, foot: '모든 글에 출처 링크가 있어요.' },
}[kind];
let all = [], status = 'open', chip = '전체', sort = 'votes';
function render() {
  let list = all.filter((p) => kind !== 'program' || p.status === status);
  const chips = ['전체', ...new Set(list.map(T.chip))];
  if (!chips.includes(chip)) chip = '전체';
  $('#chips').replaceChildren(...chips.map((c) => { const b = document.createElement('button'); b.className = 'chip' + (c === chip ? ' on' : ''); b.textContent = c; b.onclick = () => { chip = c; render(); }; return b; }));
  list = list.filter((p) => chip === '전체' || T.chip(p) === chip);
  list = sort === 'votes' ? list.sort((a, b) => b.votes - a.votes) : list.sort((a, b) => String(b.start || b.date || b.updatedAt || '').localeCompare(String(a.start || a.date || a.updatedAt || '')));
  $('#list').replaceChildren(...list.map((p, i) => T.row(p, i + 1)));
  if (!list.length) $('#list').innerHTML = '<div class="empty">아직 글이 없어요.</div>';
  if (kind === 'program') $('#stabs').innerHTML = [['open', '진행'], ['done', '완료']].map(([k, l]) => `<button data-k="${k}" class="${k === status ? 'on' : ''}">${l}<small>${all.filter((p) => p.status === k).length}</small></button>`).join(''), $$('#stabs button').forEach((b) => b.onclick = () => { status = b.dataset.k; render(); });
}
$$('#sort button').forEach((b) => b.onclick = () => { sort = b.dataset.s; $$('#sort button').forEach((x) => x.classList.toggle('on', x === b)); render(); });
mountShell({ active: kind }).then(async () => {
  $('#pageH1').textContent = T.h1; $('#pageSub').textContent = T.sub; document.title = `${T.h1} · 섬업`; $('#stabs').hidden = kind !== 'program';
  const d = await api(`/api/posts/${kind}`); all = d.items || []; render();
  $('#foot').textContent = T.foot + (d.updatedAt ? ` 공고 자동 갱신: ${new Date(d.updatedAt).toLocaleString('ko-KR')}` : '');
});
</script>
</body>
</html>
