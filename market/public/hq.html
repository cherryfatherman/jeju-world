<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본부 · 섬업</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
<style>
  body { background: #14110d; color: #f4efe8; overflow: hidden; height: 100dvh; }
  .hq { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: 56px minmax(0, 1fr); height: 100dvh; }
  .hqbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .hqbar b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; } .hqbar b em { font-style: normal; color: var(--accent); }
  .hqbar .state { font-size: 12px; color: rgba(255,255,255,.55); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hqbar .btn { height: 36px; padding: 0 14px; font-size: 13px; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); color: #fff; }
  .hqbar .btn:hover { background: rgba(255,255,255,.16); } .hqbar .btn.primary { background: var(--accent); border-color: var(--accent); }
  .stage { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 60%, #2a231b 0%, #14110d 70%); touch-action: none; }
  .stage canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .lab { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; text-align: center; white-space: nowrap; user-select: none; padding-bottom: 6px; }
  .lab b { display: block; font-size: 15px; font-weight: 800; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .lab small { font-size: 11px; color: rgba(255,255,255,.7); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .lab i { font-style: normal; display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; margin-left: 4px; }
  .lab.sel b { color: var(--accent); }
  .lab.core b { font-size: 18px; } .lab.core { pointer-events: none; }
  .gleft { position: absolute; left: 14px; top: 14px; width: 190px; display: grid; gap: 8px; }
  .gleft input { height: 34px; min-height: 0; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.35); color: #fff; padding: 0 14px; font-size: 13px; }
  .gleft input::placeholder { color: rgba(255,255,255,.45); }
  #glegend { display: grid; gap: 2px; }
  #glegend button { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; color: rgba(255,255,255,.85); font-size: 13px; font-weight: 600; text-align: left; }
  #glegend button:hover, #glegend button.sel { background: rgba(255,255,255,.1); color: #fff; }
  #glegend i { width: 10px; height: 10px; border-radius: 50%; } #glegend small { color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums; }
  .gzoom { position: absolute; right: 14px; top: 14px; display: grid; gap: 4px; }
  .gzoom button { width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.1); color: #fff; font-size: 16px; border: 1px solid rgba(255,255,255,.14); }
  .gzoom button:hover { background: rgba(255,255,255,.2); }
  .gtip { position: absolute; pointer-events: none; transform: translate(-50%, -130%); background: rgba(0,0,0,.82); color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; z-index: 5; }
  .gpop { position: absolute; transform: translate(-50%, 14px); background: #fff; color: var(--ink); border-radius: 12px; padding: 12px 14px; width: 240px; box-shadow: 0 12px 32px rgba(0,0,0,.4); z-index: 6; }
  .gpop small { color: var(--ink-3); font-size: 12px; } .gpop b { display: block; font-size: 14px; line-height: 1.35; margin: 2px 0 8px; }
  .gpop a { color: var(--accent); font-weight: 700; font-size: 13px; margin-right: 12px; }
  .hint { position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: rgba(255,255,255,.45); }
  .legend { position: absolute; right: 16px; bottom: 14px; display: flex; gap: 12px; font-size: 12px; color: rgba(255,255,255,.6); }
  .legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--c); }
  .side { position: relative; top: auto; align-self: stretch; gap: 0; height: 100%; overflow: hidden; min-height: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); border-left: 1px solid rgba(255,255,255,.1); }
  .side .tabs3 { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); background: var(--surface); }
  .side .tabs3 button { height: 46px; font-weight: 700; font-size: 14px; color: var(--ink-3); border-bottom: 2px solid transparent; }
  .side .tabs3 button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .side .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-gutter: stable; padding: 16px 16px 40px; display: none; }
  .side .scroll::-webkit-scrollbar { width: 10px; } .side .scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.22); border-radius: 10px; border: 2px solid var(--bg); } .side .scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.4); }
  .side .tabs3 { flex: none; position: sticky; top: 0; z-index: 2; } .side .scroll.on { display: block; }
  .side h3 { font-size: 13px; font-weight: 800; color: var(--ink-3); margin: 18px 0 8px; letter-spacing: 0; }
  .side input, .side textarea, .side select { min-height: 36px; padding: 6px 10px; font-size: 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); width: 100%; }
  .side textarea { min-height: 56px; resize: vertical; }
  .pname { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; }
  .pname input[type=color] { padding: 2px; height: 36px; min-height: 0; }
  .pname input.big { font-size: 20px; font-weight: 800; border-color: transparent; background: transparent; padding-left: 4px; }
  .pname input.big:focus { border-color: var(--line-strong); background: var(--surface); }
  .facts2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .facts2 div { padding: 10px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
  .facts2 b { display: block; font-size: 20px; font-weight: 800; } .facts2 span { font-size: 11px; color: var(--ink-3); }
  .team { display: flex; flex-wrap: wrap; gap: 6px; }
  .team span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
  .team span i, .ava { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; flex: none; }
  .team span small { color: var(--ink-3); font-weight: 600; }
  .task { display: grid; grid-template-columns: 76px 1fr 28px; gap: 6px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .task select { font-size: 12px; padding: 4px 6px; min-height: 30px; font-weight: 700; }
  .task .t b { font-size: 14px; font-weight: 700; display: block; line-height: 1.35; } .task .t small { font-size: 12px; color: var(--ink-3); line-height: 1.4; display: block; }
  .task.done .t b { text-decoration: line-through; color: var(--ink-3); }
  .task .x { color: var(--ink-4); font-size: 16px; height: 30px; } .task .x:hover { color: var(--danger); }
  .addrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-top: 10px; }
  .agent { display: grid; grid-template-columns: 28px 84px 74px 1fr 24px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .agent input, .agent select { min-height: 30px; padding: 3px 6px; font-size: 12px; }
  .scorebox { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; background: #fff; display: grid; gap: 10px; }
  .sctop { display: flex; align-items: center; gap: 14px; } .sctop b { font-size: 44px; font-weight: 900; color: var(--accent); line-height: 1; } .sctop b small { font-size: 16px; margin-left: 2px; } .sctop span { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
  .scrow { display: grid; grid-template-columns: 1fr 90px 30px; gap: 4px 10px; align-items: center; font-size: 13px; font-weight: 700; } .scrow small { color: var(--ink-4); font-weight: 600; }
  .scrow i { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; } .scrow u { display: block; height: 100%; background: var(--accent-2); border-radius: 4px; } .scrow.low u { background: var(--accent); }
  .scrow b { text-align: right; } .scrow p { grid-column: 1 / -1; font-size: 12px; font-weight: 500; color: var(--ink-3); line-height: 1.45; } .scrow.low p { color: var(--ink-2); }
  .msg { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 0; }
  .msg .who { font-size: 12px; font-weight: 800; } .msg .who small { color: var(--ink-3); font-weight: 600; }
  .msg p { font-size: 14px; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; border-radius: 4px 12px 12px 12px; margin-top: 3px; }
  .msg.all p { background: var(--accent-soft); border-color: rgba(255,107,26,.4); font-weight: 600; }
  .round { font-size: 11px; font-weight: 800; color: var(--ink-3); text-align: center; margin: 14px 0 4px; }
  .login { position: fixed; inset: 0; display: grid; place-items: center; background: #14110d; z-index: 50; }
  .login form { width: min(340px, 90vw); display: grid; gap: 12px; color: var(--ink); }
  .ring2d { position: absolute; inset: 0; display: none; place-content: center; gap: 8px; grid-template-columns: repeat(2, 150px); }
  .ring2d button { padding: 14px; border-radius: 12px; color: #fff; font-weight: 800; }
  @media (max-width: 860px) {
    body { overflow: auto; height: auto; } .hq { grid-template-columns: 1fr; grid-template-rows: 56px 46vh auto; height: auto; }
    .side { border-left: 0; height: auto; overflow: visible; } .side .scroll { overflow: visible; } .hqbar .state { display: none; } .hqbar { gap: 6px; padding: 0 10px; } .hqbar .btn { padding: 0 10px; }
    .legend { display: none; } .hint { display: none; } .gleft { left: 10px; right: 58px; top: 10px; width: auto; } .gleft input { display: none; } #glegend { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } #glegend button { flex: none; display: flex; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.14); }
  }
</style>
</head>
<body>
<div class="login" id="login" hidden><form class="form" id="loginForm"><h3>섬업 본부</h3><p class="note">관리자 비밀번호를 넣어 주세요.</p><input type="password" name="pw" required autocomplete="current-password" placeholder="비밀번호"><button class="btn primary">들어가기</button></form></div>
<div class="hq">
  <div class="hqbar"><b><em>섬업</em> 본부</b><span class="state" id="state"></span><button class="btn primary" id="cycleBtn">지금 회의</button><button class="btn" id="shiftBtn" title="AI 직원이 자기 페이지에서 답글·이야기를 남기고 보고해요">지금 근무</button><button class="btn" id="addPillar">＋ 줄기</button><a class="btn" href="./admin.html">관리자</a><a class="btn" href="./">사이트</a></div>
  <div class="stage" id="stage"><canvas id="c"></canvas>
    <div class="gleft"><input id="gq" placeholder="제목 찾기" aria-label="찾기"><div id="glegend"></div></div>
    <div class="gzoom"><button id="zin" aria-label="확대">＋</button><button id="zout" aria-label="축소">－</button><button id="zfit" aria-label="전체 보기">⟲</button></div>
    <div class="gtip" id="gtip" hidden></div><div class="gpop" id="gpop" hidden></div>
    <span class="hint">끌어서 이동 · 휠로 확대/축소 · 점을 눌러 열기 · 큰 점을 눌러 줄기 고치기</span>
    <div class="legend"><span style="--c:#fff">제안</span><span style="--c:#ff6b1a">진행</span><span style="--c:#6b635a">완료</span><span style="--c:transparent;border:0">■ 할 일 · ● 글</span></div></div>
  <aside class="side">
    <div class="tabs3"><button data-t="pillar" class="on">줄기</button><button data-t="org">조직</button><button data-t="log">회의록</button></div>
    <div class="scroll on" id="t-pillar"></div>
    <div class="scroll" id="t-org"></div>
    <div class="scroll" id="t-log"></div>
  </aside>
</div>

<script type="module">

let HQ = { pillars: [], agents: [], tasks: [], log: [], facts: {} }, sel = null, saveTimer = null;
const RANKS = ['본부장', '부서장', '팀장', '팀원'];
const STATUS = { proposed: '제안', doing: '진행', done: '완료' };
const FACT = {
  deal: [['open', '거래 중'], ['done', '완료'], ['real', '실제 글'], ['inquiries', '문의'], ['noPhoto', '사진 없음'], ['noArea', '동네 없음']],
  program: [['open', '진행'], ['done', '완료'], ['closing', '마감 임박'], ['auto', '자동 수집']],
  insight: [['count', '글'], ['categories', '분류'], ['newestDays', '마지막 추가(일 전)']],
  hackathon: [['open', '열린 해커톤'], ['winners', '수상작'], ['feedDays', '수집(일 전)']],
  community: [['votes', '누적 업'], ['comments', '이야기'], ['commentsWeek', '이번 주'], ['feedback', '제보'], ['waitlist', '알림 신청']],
  life: [['guides', '생활정보'], ['places', '여행 장소'], ['staleGuides', '오래된 글'], ['noCoord', '좌표 없음']],
  partner: [['support', '연결 기관'], ['ads', '광고 자리']],
};
const pillarOf = (id) => HQ.pillars.find((p) => p.id === id);
const agentOf = (id) => HQ.agents.find((a) => a.id === id);
const colorOfAgent = (a) => pillarOf(a?.pillar)?.color || '#1b1915';
const ava = (a) => `<i class="ava" style="background:${colorOfAgent(a)}">${esc((a?.name || '?').charAt(0))}</i>`;

/* ── 저장: 고치면 잠깐 뒤 자동 저장 ── */
function touch() { clearTimeout(saveTimer); $('#state').textContent = '저장 중…'; saveTimer = setTimeout(async () => { try { if (HQ.tasks.some((t) => t.status === 'doing' && !t.result)) $('#state').textContent = '팀원이 일하는 중…'; const r = await api('/api/admin/hq', { pillars: HQ.pillars, agents: HQ.agents, tasks: HQ.tasks }, 'PUT'); $('#state').textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR'); if (r && r.ran) { toast(`팀원이 할 일 ${r.ran}건을 바로 했어요`); await load(); } } catch (e) { $('#state').textContent = '저장 실패: ' + e.message; } }, 700); }

/* ── 지식 지도: 가운데 섬업, 줄기마다 실제 글이 점으로 모인다. 끌어서 이동, 휠·핀치로 확대/축소 ── */
const stage = $('#stage'), canvas = $('#c'), ctx = canvas.getContext('2d');
let GRAPH = {}, clusters = [], view = { x: 0, y: 0, k: 1 }, target = null, lastTouch = 0, hover = null, query = '', W = 0, H = 0, DPR = 1;
const GOLD = 2.39996323;
function build3D() { // 이름은 예전 그대로 두고 내용만 2D 지식 지도
  const n = HQ.pillars.length || 1;
  const sized = HQ.pillars.map((p) => { const items = (GRAPH[p.id] || []); const tasks = HQ.tasks.filter((t) => t.pillar === p.id); return { p, items, tasks, r: Math.max(58, Math.min(150, 13 * Math.sqrt(items.length + 6))) }; });
  // 큰 묶음일수록 고리에서 넓은 자리를 차지하게 해서 서로 겹치지 않게 한다
  const span = sized.map((c) => c.r * 2 + 150); const total = span.reduce((a, b) => a + b, 0);
  const ring = Math.max(320, total / (2 * Math.PI), Math.max(...sized.map((c) => c.r)) + 200);
  let acc = 0;
  clusters = sized.map((c, i) => {
    const a = -Math.PI / 2 + ((acc + span[i] / 2) / total) * Math.PI * 2; acc += span[i]; const cx = Math.cos(a) * ring, cy = Math.sin(a) * ring;
    const nodes = c.items.map((it, k) => { const sy = 1 - (2 * (k + 0.5)) / c.items.length; return { ...it, a: k * GOLD, sy, sr: Math.sqrt(Math.max(0, 1 - sy * sy)), ph: k * 1.7 }; });
    const tasks = c.tasks.slice(0, 16).map((t, k, arr) => ({ t: t.title, s: '할 일 · ' + STATUS[t.status], task: t, a: (k / arr.length) * Math.PI * 2, rr: c.r + 30 }));
    return { ...c, cx, cy, nodes, tasks, spin: (i % 2 ? 1 : -1) };
  });
  $('#glegend').replaceChildren(...clusters.map((c) => { const b = document.createElement('button'); b.dataset.id = c.p.id; b.innerHTML = `<i style="background:${esc(c.p.color)}"></i><span>${esc(c.p.name)}</span><small>${c.items.length}</small>`; b.onclick = () => { select(c.p.id); flyTo(c); }; return b; }));
  paintSel(); if (!build3D.fitted && W) { fit(); build3D.fitted = true; }
}
function paintSel() { $$('#glegend button').forEach((b) => b.classList.toggle('sel', b.dataset.id === sel)); }
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = stage.clientWidth; H = stage.clientHeight; canvas.width = W * DPR; canvas.height = H * DPR; if (clusters.length && !build3D.fitted) { fit(); build3D.fitted = true; } }
new ResizeObserver(resize).observe(stage);
function extent() { let m = 200; for (const c of clusters) m = Math.max(m, Math.hypot(c.cx, c.cy) + c.r + 60); return m; }
function fit() { const e = extent(); target = { x: 0, y: 0, k: Math.min(W, H) / (e * 2) }; if (!fit.done) { view = { ...target }; fit.done = true; } }
function flyTo(c) { const k = Math.min(2.2, Math.min(W, H) / (c.r * 3.2)); target = { x: -c.cx * k, y: -c.cy * k, k }; lastTouch = Date.now(); }
const toWorld = (px, py) => ({ x: (px - W / 2 - view.x) / view.k, y: (py - H / 2 - view.y) / view.k });
function nodePos(c, nd, t) { const a = nd.a + t * 0.00016 * c.spin; const R = c.r * 0.92; return { x: c.cx + Math.cos(a) * nd.sr * R, y: c.cy + nd.sy * R * 0.94 + Math.sin(a) * nd.sr * R * 0.16, z: Math.sin(a) * nd.sr }; }
function hexA(hex, al) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${al})`; }
let T0 = 0;
function frame(t) {
  requestAnimationFrame(frame); T0 = t; if (!W) return;
  if (target) { view.x += (target.x - view.x) * 0.12; view.y += (target.y - view.y) * 0.12; view.k += (target.k - view.k) * 0.12; if (Math.abs(target.k - view.k) < 0.001 && Math.abs(target.x - view.x) < 0.5) target = null; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(DPR * view.k, 0, 0, DPR * view.k, DPR * (W / 2 + view.x), DPR * (H / 2 + view.y));
  const k = view.k, q = query;
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  // 바닥: 가운데에서 퍼지는 옅은 궤도
  const E = extent(); ctx.lineWidth = 1 / k;
  for (let n = 1; n <= 3; n++) { ctx.strokeStyle = `rgba(255,255,255,${0.05 - n * 0.01})`; ctx.beginPath(); ctx.ellipse(0, 0, (E * n) / 3.2, (E * n) / 3.2, 0, 0, 6.2832); ctx.stroke(); }
  // 줄기: 가운데에서 휘어 나가는 빛, 그 위를 흐르는 점
  for (const [idx, c] of clusters.entries()) {
    const d = Math.hypot(c.cx, c.cy), nx = -c.cy / d, ny = c.cx / d, bend = 46 * (idx % 2 ? 1 : -1), mx = c.cx / 2 + nx * bend, my = c.cy / 2 + ny * bend;
    const g = ctx.createLinearGradient(0, 0, c.cx, c.cy); g.addColorStop(0, 'rgba(255,107,26,.55)'); g.addColorStop(1, hexA(c.p.color, c.p.id === sel ? 0.9 : 0.5));

  if (S) html += `<div class="scorebox"><div class="sctop"><b>${S.total}<small>점</small></b><span>사이트 점수 (100점 만점)<br>회의할 때마다 코드가 다시 잽니다</span></div>${S.items.map((x) => `<div class="scrow${x.id === S.lowest ? ' low' : ''}"><span>${esc(x.name)} <small>비중 ${x.weight}</small></span><i><u style="width:${x.score}%"></u></i><b>${x.score}</b><p>${esc(x.why)}${x.id === S.lowest ? ` → ${esc(x.next)}` : ''}</p></div>`).join('')}</div>`;
  for (const m of HQ.log) { // 최신 회의가 위, 회의 안에서는 말한 순서대로
    if (m.round !== round) { round = m.round; html += `<div class="round">${m.round}번째 회의 · ${new Date(m.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}${m.ai ? ' · AI 작성' : ''}</div>`; html += HQ.log.filter((x) => x.round === round).slice().reverse().map((x) => { const a = agentOf(x.from), to = x.to === 'all' ? '모두' : agentOf(x.to)?.name || ''; return `<div class="msg ${x.to === 'all' ? 'all' : ''}">${ava(a)}<div><span class="who">${esc(a?.name || x.from)} <small>${esc(a?.rank || '')} → ${esc(to)}</small></span><p>${esc(x.text)}</p></div></div>`; }).join(''); }
  }
  box.innerHTML = html;
}
function setState() { const c = HQ.lastCycle; $('#state').textContent = (HQ.score ? `사이트 점수 ${HQ.score.total}점 · ` : '') + (c ? `마지막 회의 ${new Date(c.at).toLocaleString('ko-KR')} · ${c.round}번째${c.ai ? ' · AI' : ''}` : '아직 회의 전'); }
async function load() {
  [HQ, GRAPH] = await Promise.all([api('/api/admin/hq'), api('/api/admin/hq/graph')]); if (!sel || !pillarOf(sel)) sel = HQ.pillars[0]?.id || null;
  build3D(); renderPillar(); renderOrg(); renderLog(); setState();
}
$('#shiftBtn').onclick = async (e) => { const b = e.currentTarget; b.disabled = true; b.textContent = '근무 중…'; try { const r = await api('/api/admin/hq/shift', {}); toast(`근무 끝 · 답글 ${r.replies}건 · 이야기 ${r.notes}건${r.ai ? '' : ' (AI 연결이 안 돼 정해진 문장으로 남겼어요)'}`); await load(); document.querySelector('.tabs3 [data-t=log]')?.click(); } catch (err) { toast(err.message); } b.disabled = false; b.textContent = '지금 근무'; };
$('#cycleBtn').onclick = async (e) => { const b = e.currentTarget; b.disabled = true; b.textContent = '회의 중…'; try { const r = await api('/api/admin/hq/cycle', {}); toast(`회의 끝 · 새 제안 ${r.added}건${r.ai ? '' : ' (AI 없이 진행)'}`); await load(); showTab('log'); } catch (err) { toast(err.message); } b.disabled = false; b.textContent = '지금 회의'; };
$('#addPillar').onclick = () => { const name = prompt('새 줄기 이름'); if (!name) return; const id = 'p' + Date.now().toString(36); HQ.pillars.push({ id, name: name.slice(0, 20), dept: name.slice(0, 16) + '부', color: '#888888', goal: '', kpi: '' }); touch(); build3D(); select(id); renderOrg(); };

/* ── 들어가기 ── */
async function enter() { try { await load(); $('#login').hidden = true; resize(); requestAnimationFrame(frame); } catch { sessionStorage.removeItem('adminpw'); $('#login').hidden = false; } }
$('#loginForm').onsubmit = async (e) => { e.preventDefault(); const pw = e.target.pw.value; try { await api('/api/admin/login', { password: pw }); sessionStorage.setItem('adminpw', pw); enter(); } catch (err) { toast(err.message); } };
sessionStorage.getItem('adminpw') ? enter() : ($('#login').hidden = false);
</script>
</body>
