<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본부 · 섬업</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
<style>
  body { background: #14110d; color: #f4efe8; overflow: hidden; height: 100dvh; }
  .hq { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: 56px minmax(0, 1fr); height: 100dvh; }
  .hqbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .hqbar b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; } .hqbar b em { font-style: normal; color: var(--accent); }
  .hqbar .state { font-size: 12px; color: rgba(255,255,255,.55); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hqbar .btn { height: 36px; padding: 0 14px; font-size: 13px; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); color: #fff; }
  .hqbar .btn:hover { background: rgba(255,255,255,.16); } .hqbar .btn.primary { background: var(--accent); border-color: var(--accent); }
  .stage { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 60%, #2a231b 0%, #14110d 70%); touch-action: none; }
  .stage canvas { width: 100%; height: 100%; display: block; cursor: grab; } .stage canvas:active { cursor: grabbing; }
  .lab { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; text-align: center; white-space: nowrap; user-select: none; padding-bottom: 6px; }
  .lab b { display: block; font-size: 15px; font-weight: 800; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .lab small { font-size: 11px; color: rgba(255,255,255,.7); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .lab i { font-style: normal; display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 800; margin-left: 4px; }
  .lab.sel b { color: var(--accent); }
  .lab.core b { font-size: 18px; } .lab.core { pointer-events: none; }
  .hint { position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: rgba(255,255,255,.45); }
  .legend { position: absolute; right: 16px; bottom: 14px; display: flex; gap: 12px; font-size: 12px; color: rgba(255,255,255,.6); }
  .legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--c); }
  .side { min-height: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); border-left: 1px solid rgba(255,255,255,.1); }
  .side .tabs3 { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); background: var(--surface); }
  .side .tabs3 button { height: 46px; font-weight: 700; font-size: 14px; color: var(--ink-3); border-bottom: 2px solid transparent; }
  .side .tabs3 button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .side .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: none; } .side .scroll.on { display: block; }
  .side h3 { font-size: 13px; font-weight: 800; color: var(--ink-3); margin: 18px 0 8px; letter-spacing: 0; }
  .side input, .side textarea, .side select { min-height: 36px; padding: 6px 10px; font-size: 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); width: 100%; }
  .side textarea { min-height: 56px; resize: vertical; }
  .pname { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; }
  .pname input[type=color] { padding: 2px; height: 36px; min-height: 0; }
  .pname input.big { font-size: 20px; font-weight: 800; border-color: transparent; background: transparent; padding-left: 4px; }
  .pname input.big:focus { border-color: var(--line-strong); background: var(--surface); }
  .facts2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .facts2 div { padding: 10px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-align: center; }
  .facts2 b { display: block; font-size: 20px; font-weight: 800; } .facts2 span { font-size: 11px; color: var(--ink-3); }
  .team { display: flex; flex-wrap: wrap; gap: 6px; }
  .team span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
  .team span i, .ava { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; flex: none; }
  .team span small { color: var(--ink-3); font-weight: 600; }
  .task { display: grid; grid-template-columns: 76px 1fr 28px; gap: 6px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .task select { font-size: 12px; padding: 4px 6px; min-height: 30px; font-weight: 700; }
  .task .t b { font-size: 14px; font-weight: 700; display: block; line-height: 1.35; } .task .t small { font-size: 12px; color: var(--ink-3); line-height: 1.4; display: block; }
  .task.done .t b { text-decoration: line-through; color: var(--ink-3); }
  .task .x { color: var(--ink-4); font-size: 16px; height: 30px; } .task .x:hover { color: var(--danger); }
  .addrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-top: 10px; }
  .agent { display: grid; grid-template-columns: 28px 84px 74px 1fr 24px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .agent input, .agent select { min-height: 30px; padding: 3px 6px; font-size: 12px; }
  .msg { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 0; }
  .msg .who { font-size: 12px; font-weight: 800; } .msg .who small { color: var(--ink-3); font-weight: 600; }
  .msg p { font-size: 14px; line-height: 1.5; background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; border-radius: 4px 12px 12px 12px; margin-top: 3px; }
  .msg.all p { background: var(--accent-soft); border-color: #ffd9c2; font-weight: 600; }
  .round { font-size: 11px; font-weight: 800; color: var(--ink-3); text-align: center; margin: 14px 0 4px; }
  .login { position: fixed; inset: 0; display: grid; place-items: center; background: #14110d; z-index: 50; }
  .login form { width: min(340px, 90vw); display: grid; gap: 12px; color: var(--ink); }
  .ring2d { position: absolute; inset: 0; display: none; place-content: center; gap: 8px; grid-template-columns: repeat(2, 150px); }
  .ring2d button { padding: 14px; border-radius: 12px; color: #fff; font-weight: 800; }
  @media (max-width: 860px) {
    body { overflow: auto; height: auto; } .hq { grid-template-columns: 1fr; grid-template-rows: 56px 46vh auto; height: auto; }
    .side { border-left: 0; } .side .scroll { overflow: visible; } .hqbar .state { display: none; } .hqbar { gap: 6px; padding: 0 10px; } .hqbar .btn { padding: 0 10px; }
    .legend { display: none; } .lab small { display: none; } .lab b { font-size: 13px; } .lab.core b { font-size: 15px; } .lab i { font-size: 10px; min-width: 16px; padding: 0 5px; }
  }
</style>
</head>
<body>
<div class="login" id="login" hidden><form class="form" id="loginForm"><h3>섬업 본부</h3><p class="note">관리자 비밀번호를 넣어 주세요.</p><input type="password" name="pw" required autocomplete="current-password" placeholder="비밀번호"><button class="btn primary">들어가기</button></form></div>
<div class="hq">
  <div class="hqbar"><b><em>섬업</em> 본부</b><span class="state" id="state"></span><button class="btn primary" id="cycleBtn">지금 회의</button><button class="btn" id="addPillar">＋ 줄기</button><a class="btn" href="./admin.html">관리자</a><a class="btn" href="./">사이트</a></div>
  <div class="stage" id="stage"><canvas id="c"></canvas><div id="labels"></div><div class="ring2d" id="ring2d"></div><span class="hint">끌어서 돌리기 · 줄기를 눌러 고치기</span><div class="legend"><span style="--c:#fff">제안</span><span style="--c:#ff6b1a">진행</span><span style="--c:#6b635a">완료</span></div></div>
  <aside class="side">
    <div class="tabs3"><button data-t="pillar" class="on">줄기</button><button data-t="org">조직</button><button data-t="log">회의록</button></div>
    <div class="scroll on" id="t-pillar"></div>
    <div class="scroll" id="t-org"></div>
    <div class="scroll" id="t-log"></div>
  </aside>
</div>

<script type="module">
import * as THREE from './vendor/three.module.js';

let HQ = { pillars: [], agents: [], tasks: [], log: [], facts: {} }, sel = null, saveTimer = null;
const RANKS = ['본부장', '부서장', '팀장', '팀원'];
const STATUS = { proposed: '제안', doing: '진행', done: '완료' };
const FACT = {
  deal: [['open', '거래 중'], ['done', '완료'], ['real', '실제 글'], ['inquiries', '문의'], ['noPhoto', '사진 없음'], ['goods', '집·물건']],
  program: [['open', '진행'], ['done', '완료'], ['closing', '마감 임박'], ['auto', '자동 수집']],
  insight: [['count', '글'], ['categories', '분류'], ['newestDays', '마지막 추가(일 전)']],
  hackathon: [['open', '열린 해커톤'], ['winners', '수상작'], ['feedDays', '수집(일 전)']],
  community: [['votes', '누적 업'], ['comments', '이야기'], ['commentsWeek', '이번 주'], ['feedback', '제보'], ['waitlist', '알림 신청']],
  life: [['guides', '생활정보'], ['places', '여행 장소'], ['staleGuides', '오래된 글']],
  partner: [['support', '연결 기관'], ['ads', '광고 자리']],
};
const pillarOf = (id) => HQ.pillars.find((p) => p.id === id);
const agentOf = (id) => HQ.agents.find((a) => a.id === id);
const colorOfAgent = (a) => pillarOf(a?.pillar)?.color || '#1b1915';
const ava = (a) => `<i class="ava" style="background:${colorOfAgent(a)}">${esc((a?.name || '?').charAt(0))}</i>`;

/* ── 저장: 고치면 잠깐 뒤 자동 저장 ── */
function touch() { clearTimeout(saveTimer); $('#state').textContent = '저장 중…'; saveTimer = setTimeout(async () => { try { await api('/api/admin/hq', { pillars: HQ.pillars, agents: HQ.agents, tasks: HQ.tasks }, 'PUT'); $('#state').textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR'); } catch (e) { $('#state').textContent = '저장 실패: ' + e.message; } }, 700); }

/* ── 3D: 고리 위의 줄기들 ── */
const stage = $('#stage'), canvas = $('#c'), labels = $('#labels');
let renderer = null, scene, camera, world, nodes = [], yaw = 0.5, pitch = 0, zoom = 1, lastTouch = 0, R = 5.6;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); } catch { renderer = null; }
if (renderer) {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a2f24, 1.5));
  const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(6, 10, 8); scene.add(dl);
  world = new THREE.Group(); scene.add(world);
}
function build3D() {
  labels.innerHTML = ''; nodes = [];
  if (!renderer) { $('#ring2d').style.display = 'grid'; $('#ring2d').replaceChildren(...HQ.pillars.map((p) => { const b = document.createElement('button'); b.style.background = p.color; b.textContent = p.name; b.onclick = () => select(p.id); return b; })); return; }
  while (world.children.length) world.remove(world.children[0]);
  // 가운데: 섬업
  const core = new THREE.Mesh(new THREE.SphereGeometry(1.15, 48, 32), new THREE.MeshStandardMaterial({ color: 0xff6b1a, roughness: 0.35, metalness: 0.05, emissive: 0x5a2000, emissiveIntensity: 0.5 }));
  world.add(core); nodes.push({ mesh: core, core: true, el: label('섬업', '제주(섬)에서 창업을 거래하다', 0, true), h: 1.3 });
  // 고리
  const ring = new THREE.Mesh(new THREE.TorusGeometry(R, 0.035, 12, 160), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 }));
  ring.rotation.x = Math.PI / 2; world.add(ring);
  const n = HQ.pillars.length || 1;
  HQ.pillars.forEach((p, i) => {
    const a = (i / n) * Math.PI * 2; const pos = new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R);
    const tasks = HQ.tasks.filter((t) => t.pillar === p.id); const open = tasks.filter((t) => t.status !== 'done');
    const g = new THREE.Group(); g.position.copy(pos); world.add(g);
    const col = new THREE.Color(p.color);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.62 + Math.min(open.length, 6) * 0.045, 40, 28), new THREE.MeshStandardMaterial({ color: col, roughness: 0.4, emissive: col, emissiveIntensity: 0.18 }));
    mesh.userData.id = p.id; g.add(mesh);
    // 가운데와 잇는 살
    const spoke = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), pos]), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.35 })); world.add(spoke);
    // 할 일 위성
    const orbit = new THREE.Group(); orbit.rotation.x = 0.5; orbit.rotation.z = (i % 2 ? 1 : -1) * 0.35; g.add(orbit);
    tasks.slice(0, 10).forEach((t, k, arr) => {
      const b = (k / arr.length) * Math.PI * 2;
      const sat = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshStandardMaterial({ color: t.status === 'doing' ? 0xff6b1a : t.status === 'done' ? 0x6b635a : 0xffffff, roughness: 0.5, emissive: t.status === 'doing' ? 0xff6b1a : 0x000000, emissiveIntensity: 0.4 }));
      sat.position.set(Math.cos(b) * 1.15, 0, Math.sin(b) * 1.15); orbit.add(sat);
    });
    nodes.push({ mesh, g, orbit, id: p.id, el: label(p.name, p.dept, open.length, false, p.id), h: 0.85 });
  });
  paintSel();
}
function label(name, sub, count, core, id) {
  const d = document.createElement('div'); d.className = 'lab' + (core ? ' core' : '');
  d.innerHTML = `<b>${esc(name)}${count ? `<i>${count}</i>` : ''}</b><small>${esc(sub || '')}</small>`;
  if (id) d.onclick = () => select(id);
  labels.append(d); return d;
}
function paintSel() { for (const nd of nodes) { if (nd.core) continue; const on = nd.id === sel; nd.mesh.scale.setScalar(on ? 1.28 : 1); nd.mesh.material.emissiveIntensity = on ? 0.65 : 0.18; nd.el.classList.toggle('sel', on); } }
function resize() { if (!renderer) return; const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
const v3 = new THREE.Vector3();
function frame(t) {
  requestAnimationFrame(frame);
  if (!renderer || !stage.clientWidth) return;
  if (Date.now() - lastTouch > 3500) yaw += 0.0012;
  const narrow = camera.aspect < 0.9; const dist = (narrow ? 23 : camera.aspect < 1.35 ? 17.5 : 18) / zoom;
  camera.position.set(0, dist * (0.52 + pitch), dist * 0.86); camera.lookAt(0, -0.3, 0);
  world.rotation.y = yaw;
  for (const nd of nodes) if (nd.orbit) nd.orbit.rotation.y = t * 0.0005;
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const nd of nodes) {
    nd.mesh.getWorldPosition(v3); v3.y += nd.h; const z = v3.clone().project(camera);
    nd.el.style.left = ((z.x + 1) / 2) * w + 'px'; nd.el.style.top = ((1 - z.y) / 2) * h + 'px';
    const far = nd.mesh.getWorldPosition(new THREE.Vector3()).distanceTo(camera.position); nd.el.style.zIndex = String(Math.round(1000 - far * 10)); nd.el.style.opacity = nd.core ? '1' : String(Math.max(0.6, Math.min(1, 1.9 - far / 20)));
  }
}
// 끌어서 돌리기 · 눌러서 고르기
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, yaw, pitch, moved: 0 }; canvas.setPointerCapture(e.pointerId); lastTouch = Date.now(); });
canvas.addEventListener('pointermove', (e) => { if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; down.moved = Math.max(down.moved, Math.abs(dx) + Math.abs(dy)); yaw = down.yaw + dx * 0.006; pitch = Math.max(-0.3, Math.min(0.45, down.pitch + dy * 0.003)); lastTouch = Date.now(); });
canvas.addEventListener('pointerup', (e) => {
  if (down && down.moved < 6 && renderer) { const r = canvas.getBoundingClientRect(); const m = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); const rc = new THREE.Raycaster(); rc.setFromCamera(m, camera); const hit = rc.intersectObjects(nodes.filter((n) => !n.core).map((n) => n.mesh))[0]; if (hit) select(hit.object.userData.id); }
  down = null;
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.7, Math.min(1.6, zoom - e.deltaY * 0.001)); lastTouch = Date.now(); }, { passive: false });

/* ── 오른쪽 패널 ── */
function select(id) { sel = id; paintSel(); renderPillar(); showTab('pillar'); lastTouch = Date.now(); }
function showTab(t) { $$('.tabs3 button').forEach((b) => b.classList.toggle('on', b.dataset.t === t)); $$('.side .scroll').forEach((s) => s.classList.toggle('on', s.id === 't-' + t)); }
$$('.tabs3 button').forEach((b) => b.onclick = () => showTab(b.dataset.t));

function renderPillar() {
  const p = pillarOf(sel) || HQ.pillars[0]; const box = $('#t-pillar'); if (!p) { box.innerHTML = '<p class="note">줄기가 없어요. 위의 ＋ 줄기로 만들어 보세요.</p>'; return; }
  sel = p.id; const f = HQ.facts?.[p.id] || {}; const team = HQ.agents.filter((a) => a.pillar === p.id).sort((a, b) => RANKS.indexOf(a.rank) - RANKS.indexOf(b.rank));
  const tasks = HQ.tasks.filter((t) => t.pillar === p.id).sort((a, b) => Object.keys(STATUS).indexOf(a.status) - Object.keys(STATUS).indexOf(b.status));
  const facts = (FACT[p.id] || []).map(([k, l]) => { let v = f[k]; if (Array.isArray(v)) v = v.length; return v === null || v === undefined || typeof v === 'object' ? '' : `<div><b>${esc(v)}</b><span>${l}</span></div>`; }).join('');
  box.innerHTML = `<div class="pname"><input type="color" data-p="color" value="${esc(p.color)}" aria-label="색"><input class="big" data-p="name" value="${esc(p.name)}" aria-label="줄기 이름"></div>
    <h3>목표</h3><textarea data-p="goal">${esc(p.goal || '')}</textarea>
    <div class="row2" style="margin-top:8px"><label style="font-size:12px;color:var(--ink-3)">부서 이름<input data-p="dept" value="${esc(p.dept || '')}"></label><label style="font-size:12px;color:var(--ink-3)">보는 숫자<input data-p="kpi" value="${esc(p.kpi || '')}"></label></div>
    ${facts ? `<h3>지금 숫자 (실제 데이터)</h3><div class="facts2">${facts}</div>` : ''}
    <h3>이 줄기의 사람들</h3><div class="team">${team.map((a) => `<span title="${esc(a.persona || '')}">${ava(a)}${esc(a.name)}<small>${esc(a.rank)}</small></span>`).join('') || '<span class="note">조직 탭에서 배치하세요</span>'}</div>
    <h3>할 일 · ${tasks.filter((t) => t.status !== 'done').length}개 남음</h3>
    <div id="tasks">${tasks.map((t) => `<div class="task ${t.status}" data-id="${esc(t.id)}"><select aria-label="상태">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select><div class="t"><b>${esc(t.title)}</b><small>${esc(t.why || '')}${t.owner && agentOf(t.owner) ? ` · ${esc(agentOf(t.owner).name)}${t.by === 'agent' ? ' 제안' : ''}` : ''}</small></div><button class="x" aria-label="삭제">✕</button></div>`).join('') || '<p class="note">아직 할 일이 없어요. "지금 회의"를 누르면 AI 직원이 제안해요.</p>'}</div>
    <form class="addrow" id="addTask"><input name="title" placeholder="할 일 직접 추가" maxlength="100" required><button class="btn primary sm">추가</button></form>
    <p style="margin-top:18px"><button class="btn sm" id="delPillar" style="color:var(--danger)">이 줄기 삭제</button></p>`;
  box.querySelectorAll('[data-p]').forEach((inp) => inp.oninput = () => { p[inp.dataset.p] = inp.value; touch(); if (['name', 'color', 'dept'].includes(inp.dataset.p)) { clearTimeout(renderPillar._t); renderPillar._t = setTimeout(build3D, 400); } });
  box.querySelectorAll('.task').forEach((row) => { const t = HQ.tasks.find((x) => x.id === row.dataset.id);
    row.querySelector('select').onchange = (e) => { t.status = e.target.value; touch(); renderPillar(); build3D(); };
    row.querySelector('.x').onclick = () => { HQ.tasks.splice(HQ.tasks.indexOf(t), 1); touch(); renderPillar(); build3D(); }; });
  $('#addTask').onsubmit = (e) => { e.preventDefault(); const title = e.target.title.value.trim(); if (!title) return; HQ.tasks.unshift({ id: Date.now().toString(36), pillar: p.id, owner: '', title, why: '', status: 'doing', by: 'admin', createdAt: new Date().toISOString() }); touch(); renderPillar(); build3D(); };
  $('#delPillar').onclick = () => { if (!confirm(`'${p.name}' 줄기를 지울까요? 이 줄기의 할 일도 함께 지워져요.`)) return; HQ.pillars.splice(HQ.pillars.indexOf(p), 1); HQ.tasks = HQ.tasks.filter((t) => t.pillar !== p.id); sel = HQ.pillars[0]?.id || null; touch(); build3D(); renderPillar(); renderOrg(); };
}
function renderOrg() {
  const box = $('#t-org'); const order = (a) => (a.rank === '본부장' ? -1 : HQ.pillars.findIndex((p) => p.id === a.pillar)) * 10 + RANKS.indexOf(a.rank);
  const list = HQ.agents.slice().sort((a, b) => order(a) - order(b));
  box.innerHTML = `<p class="note">가상의 AI 직원이에요. 부서장은 본부장에게 보고하고, 팀장·팀원은 부서장에게 제안해요. 성격을 고치면 다음 회의 말투가 달라져요.</p><div style="margin-top:8px">${list.map((a) => `<div class="agent" data-id="${esc(a.id)}">${ava(a)}<input data-a="name" value="${esc(a.name)}" aria-label="이름"><select data-a="rank" aria-label="직급">${RANKS.map((r) => `<option ${a.rank === r ? 'selected' : ''}>${r}</option>`).join('')}</select><select data-a="pillar" aria-label="소속"><option value="">총괄</option>${HQ.pillars.map((p) => `<option value="${esc(p.id)}" ${a.pillar === p.id ? 'selected' : ''}>${esc(p.dept || p.name)}</option>`).join('')}</select><button class="x" style="color:var(--ink-4)" aria-label="삭제">✕</button><input data-a="persona" value="${esc(a.persona || '')}" style="grid-column:2 / -1" aria-label="성격" placeholder="성격·맡은 일"></div>`).join('')}</div>
    <p style="margin-top:12px"><button class="btn sm" id="addAgent">＋ 직원 추가</button></p>`;
  box.querySelectorAll('.agent').forEach((row) => { const a = agentOf(row.dataset.id);
    row.querySelectorAll('[data-a]').forEach((inp) => inp.onchange = () => { a[inp.dataset.a] = inp.value; if (inp.dataset.a === 'pillar') a.dept = pillarOf(a.pillar)?.dept || '총괄'; touch(); if (inp.dataset.a !== 'persona') { renderOrg(); renderPillar(); } });
    row.querySelector('.x').onclick = () => { if (!confirm(`${a.name} 직원을 뺄까요?`)) return; HQ.agents.splice(HQ.agents.indexOf(a), 1); touch(); renderOrg(); renderPillar(); }; });
  $('#addAgent').onclick = () => { HQ.agents.push({ id: 'a' + Date.now().toString(36), name: '새 직원', rank: '팀원', dept: pillarOf(sel)?.dept || '총괄', pillar: sel || '', persona: '' }); touch(); renderOrg(); renderPillar(); };
}
function renderLog() {
  const box = $('#t-log'); if (!HQ.log.length) { box.innerHTML = '<p class="note">아직 회의록이 없어요. 위의 "지금 회의"를 눌러 보세요. 하루에 한 번은 자동으로 열려요.</p>'; return; }
  let html = '', round = null;
  for (const m of HQ.log) { // 최신 회의가 위, 회의 안에서는 말한 순서대로
    if (m.round !== round) { round = m.round; html += `<div class="round">${m.round}번째 회의 · ${new Date(m.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}${m.ai ? ' · AI 작성' : ''}</div>`; html += HQ.log.filter((x) => x.round === round).slice().reverse().map((x) => { const a = agentOf(x.from), to = x.to === 'all' ? '모두' : agentOf(x.to)?.name || ''; return `<div class="msg ${x.to === 'all' ? 'all' : ''}">${ava(a)}<div><span class="who">${esc(a?.name || x.from)} <small>${esc(a?.rank || '')} → ${esc(to)}</small></span><p>${esc(x.text)}</p></div></div>`; }).join(''); }
  }
  box.innerHTML = html;
}
function setState() { const c = HQ.lastCycle; $('#state').textContent = c ? `마지막 회의 ${new Date(c.at).toLocaleString('ko-KR')} · ${c.round}번째${c.ai ? ' · AI' : ''}` : '아직 회의 전'; }
async function load() {
  HQ = await api('/api/admin/hq'); if (!sel || !pillarOf(sel)) sel = HQ.pillars[0]?.id || null;
  build3D(); renderPillar(); renderOrg(); renderLog(); setState();
}
$('#cycleBtn').onclick = async (e) => { const b = e.currentTarget; b.disabled = true; b.textContent = '회의 중…'; try { const r = await api('/api/admin/hq/cycle', {}); toast(`회의 끝 · 새 제안 ${r.added}건`); await load(); showTab('log'); } catch (err) { toast(err.message); } b.disabled = false; b.textContent = '지금 회의'; };
$('#addPillar').onclick = () => { const name = prompt('새 줄기 이름'); if (!name) return; const id = 'p' + Date.now().toString(36); HQ.pillars.push({ id, name: name.slice(0, 20), dept: name.slice(0, 16) + '부', color: '#888888', goal: '', kpi: '' }); touch(); build3D(); select(id); renderOrg(); };

/* ── 들어가기 ── */
async function enter() { try { await load(); $('#login').hidden = true; resize(); requestAnimationFrame(frame); } catch { sessionStorage.removeItem('adminpw'); $('#login').hidden = false; } }
$('#loginForm').onsubmit = async (e) => { e.preventDefault(); const pw = e.target.pw.value; try { await api('/api/admin/login', { password: pw }); sessionStorage.setItem('adminpw', pw); enter(); } catch (err) { toast(err.message); } };
sessionStorage.getItem('adminpw') ? enter() : ($('#login').hidden = false);
</script>
</body>
