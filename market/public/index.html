<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바톤 · 해커톤 프로젝트의 다음 주인을 찾습니다</title>
<meta name="description" content="AI로 만든 서비스와 해커톤 프로젝트를 다음 주인에게 넘기는 장터, 바톤. 해커톤 일정과 수상작 도감도 한곳에서.">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap">
  <div id="ticker"></div>

  <section>
    <div class="sec-head"><h2>🧰 도구 상자</h2><span class="more">로그인 없이 바로 써요</span></div>
    <div class="tools" id="tools"></div>
  </section>

  <section><div class="stats" id="stats"></div></section>

  <section id="rank">
    <div class="sec-head"><h2>🔥 이번 주 추천 순위</h2><span class="more">추천 ♥ 수 기준</span></div>
    <div class="rank" id="rankList"></div>
  </section>

  <section id="projects">
    <div class="sec-head"><h2>🧩 다음 주인을 찾는 프로젝트</h2><span class="more" id="count"></span></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="hackathons">
    <div class="sec-head"><h2>📅 지금 열려 있는 해커톤</h2><span class="more" id="hackUpdated"></span></div>
    <p class="note" style="margin-bottom:12px">바톤이 자동으로 모아요. 참가하고 나면 결과물을 여기 올려 주세요.</p>
    <div class="hack" id="hackList"></div>
  </section>
</main>

<script>
let projects = [], cat = '전체', CFG;
function renderTools() {
  $('#tools').replaceChildren(...(CFG.tools || []).map((t) => { const a = document.createElement('a'); a.className = 'tool' + (t.soon ? ' soon' : ''); a.href = t.soon || !t.href ? '#' : t.href;
    if (t.soon || !t.href) a.onclick = (e) => { e.preventDefault(); toast('준비 중이에요!'); };
    a.innerHTML = `<span class="ic">${esc(t.icon)}</span><span>${esc(t.label)}<small>${esc(t.sub || '')}</small></span>${t.badge ? `<i class="bd ${t.hot ? 'hot' : ''}">${esc(t.badge)}</i>` : ''}`; return a; }));
}
function card(p) {
  const a = document.createElement('a'); a.className = 'card'; a.href = `./project.html?id=${encodeURIComponent(p.id)}`;
  a.innerHTML = `<div class="meta"><span class="badge stage-${esc(p.stage)}">${STAGE[p.stage] || ''}</span><span class="badge">${esc(p.category)}</span>${p.sample ? '<span class="badge sample">예시</span>' : ''}</div>
    <h3>${esc(p.name)}</h3><p class="tag">${esc(p.tagline)}</p>
    <div class="foot"><span class="price">${esc(priceText(p))}</span><span class="heart">♥ ${p.interest || 0}${p.comments ? ` · 💬 ${p.comments}` : ''}${p.origin ? ` · ${esc(p.origin)}` : ''}</span></div>`;
  return a;
}
function render() {
  const list = projects.filter((p) => cat === '전체' || p.category === cat);
  $('#grid').replaceChildren(...list.map(card));
  if (!list.length) $('#grid').innerHTML = '<div class="empty">아직 이 분류에 올라온 프로젝트가 없어요. 첫 번째로 올려 보세요!</div>';
  $('#count').textContent = `${list.length}개`;
}
async function loadStats() {
  const s = await api('/api/stats');
  $('#stats').innerHTML = [[s.projects, '올라온 프로젝트'], [s.interest, '추천 ♥'], [s.waitBuy, '사고 싶은 사람'], [s.hackathons, '열린 해커톤'], [s.winners, '도감 수상작']].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}
document.addEventListener('stats:refresh', loadStats);
async function load() {
  projects = await api('/api/projects');
  const cats = ['전체', ...new Set(projects.map((p) => p.category))];
  $('#chips').replaceChildren(...cats.map((c) => { const b = document.createElement('button'); b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c; b.onclick = () => { cat = c; $$('.chip').forEach((x) => x.classList.toggle('on', x === b)); render(); }; return b; }));
  render();
  const top = projects.slice().sort((a, b) => (b.interest || 0) - (a.interest || 0)).slice(0, 5);
  $('#rankList').replaceChildren(...top.map((p, i) => { const a = document.createElement('a'); a.href = `./project.html?id=${p.id}`;
    a.innerHTML = `<span class="n ${i === 0 ? 'top' : ''}">${i + 1}</span><div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.tagline)}</small></div><div class="right"><span class="cmt">💬 ${p.comments || 0}</span><span class="pill">♥ 추천 ${p.interest || 0}</span></div>`; return a; }));
  loadStats();
  const h = await api('/api/hackathons');
  const items = h.items || [];
  $('#hackUpdated').textContent = h.updatedAt ? `자동 수집 · ${new Date(h.updatedAt).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric' })}` : '수집 중…';
  $('#hackList').replaceChildren(...items.slice(0, 12).map((x) => { const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = `<span class="src ${x.source}">${x.source === 'local' ? '국내 · 직접 등록' : 'Devpost'}</span><b>${esc(x.title)}</b><span class="d">${esc(x.dates || '')} · ${esc(x.location || '')}${x.participants ? ` · ${x.participants.toLocaleString()}명 참가` : ''}</span><span class="p">${x.prize ? `상금 ${esc(x.prize)}` : ''}</span>`; return a; }));
  // 공지 띠: 국내 대회가 있으면 그것, 없으면 참가자 최다 대회
  const T = CFG.ticker || {};
  let t = null;
  if (T.enabled !== false) t = T.mode === 'custom' ? { title: T.title, dates: T.text, url: T.url } : (items.find((x) => x.source === 'local') || items[0]);
  if (t && t.title) $('#ticker').innerHTML = `<div class="ticker"><span class="ic">📣</span><div><b>${esc(t.title)}</b><small>${esc(t.dates || '')}${t.location ? ` · ${esc(t.location)}` : ''}${t.prize ? ` · 상금 ${esc(t.prize)}` : ''} ${T.mode === 'custom' ? '' : ' — 끝나면 결과물을 바톤에 올려 주세요'}</small></div>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">바로가기 →</a>` : ''}</div>`;
}
mountShell({ active: 'home' }).then((c) => { CFG = c; renderTools(); load(); });
</script>
</body>
</html>
