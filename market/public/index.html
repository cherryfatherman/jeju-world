<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탐라도감 · 제주의 모든 것을 한 권에</title>
<meta name="description" content="제주의 프로젝트·집·물건을 모으는 도감. 멈춘 해커톤 프로젝트는 다음 주인에게, 집과 물건은 사진만 올리면 AI가 글을 써요.">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap">
  <!-- 배너 (기본 1장, 관리자에서 추가 가능) -->
  <div class="carousel" id="carousel" aria-roledescription="carousel">
    <div class="slides" id="slides"></div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- 1. 오늘 바로 필요한 것: 누르면 바로 답 -->
  <section class="today">
    <div class="sec-head"><h2>오늘 바로 필요한 것</h2><span class="more" id="todayLabel"></span></div>
    <div class="quick" id="quick"></div>
  </section>

  <!-- 2. 제주여행: 관광지 · 카페 · 맛집 추천순 TOP -->
  <section>
    <div class="sec-head"><h2>지금 많이 추천한 곳</h2><a class="more" href="./places.html?type=spot">제주여행 전체</a></div>
    <div class="typetabs" id="homePlaceTabs"><button data-t="spot" class="on">관광지</button><button data-t="cafe">카페</button><button data-t="food">맛집</button></div>
    <div class="ggrid" id="places"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <!-- 3. 제주살이 가이드 -->
  <section>
    <div class="sec-head"><h2>제주살이 가이드</h2><a class="more" href="./jeju.html#sec-guides">전체 보기</a></div>
    <div class="ggrid" id="guides"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <!-- 4. 프로젝트 + 해커톤 -->
  <section>
    <div class="sec-head"><h2>다음 주인을 찾는 프로젝트</h2><a class="more" href="./market.html?type=project">전체 보기</a></div>
    <div class="grid" id="projects"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>
  <section>
    <div class="sec-head"><h2>지금 열려 있는 해커톤</h2><a class="more" href="./winners.html">수상작 도감 보기</a></div>
    <div class="hack" id="hackList"></div>
  </section>

  <!-- 5. 창업 지원 -->
  <section>
    <div class="sec-head"><h2>제주 창업 지원</h2><span class="more">기관 공식 사이트로 연결</span></div>
    <div class="support" id="support"></div>
  </section>

  <!-- 6. 장터 한 줄 -->
  <section>
    <div class="sec-head"><h2>장터에 새로 올라온 집·물건</h2><a class="more" href="./market.html?type=home">장터 전체 보기</a></div>
    <div class="pgrid" id="feed"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    <p class="note" style="margin-top:14px">사진만 올리면 글은 AI가 써요. <a href="./sell.html">30초 만에 올리기</a></p>
  </section>
</main>

<script>
let CFG;
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const SLIDES = (c) => (c.carousel || []).map((s, i) => ({ image: s.image, kicker: s.kicker, title: s.title, sub: s.sub, cta: [s.ctaLabel, s.ctaHref], link: i === 0 ? [c.banner.secondaryLabel, '#want'] : null }));
function renderCarousel() {
  const slides = SLIDES(CFG); let i = 0, timer;
  $('#slides').innerHTML = slides.map((s) => `<article class="slide" style="${s.image ? `background-image:url('${esc(s.image)}')` : ''}"><div class="stext"><p class="kicker">${esc(s.kicker)}</p><h1>${rich(s.title)}</h1><p class="sub">${rich(s.sub).replace(/<em>/g, '<b>').replace(/<\/em>/g, '</b>')}</p><div class="cta"><a class="btn primary" href="${esc(s.cta[1])}">${esc(s.cta[0])}</a>${s.link ? `<a class="textlink" href="${esc(s.link[1])}">${esc(s.link[0])} ${icon('arrow')}</a>` : ''}</div></div></article>`).join('');
  $('#dots').innerHTML = slides.length > 1 ? slides.map((_, k) => `<button aria-label="${k + 1}번 배너" class="${k === 0 ? 'on' : ''}"></button>`).join('') : '';
  const go = (k) => { i = (k + slides.length) % slides.length; $('#slides').style.transform = `translateX(-${i * 100}%)`; $$('#dots button').forEach((b, n) => b.classList.toggle('on', n === i)); };
  $$('#dots button').forEach((b, k) => b.onclick = () => { go(k); restart(); });
  const restart = () => { clearInterval(timer); if (slides.length > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(() => go(i + 1), 6000); };
  restart();
  let sx = null; const el = $('#carousel');
  el.addEventListener('pointerdown', (e) => { sx = e.clientX; }); el.addEventListener('pointerup', (e) => { if (sx === null || slides.length < 2) return; const dx = e.clientX - sx; if (Math.abs(dx) > 40) { go(i + (dx < 0 ? 1 : -1)); restart(); } sx = null; });
  const want = mountWaitlist(); $$('a[href="#want"]').forEach((a) => a.onclick = (e) => { e.preventDefault(); want.classList.add('show'); });
}
function renderQuick() {
  const todayIdx = (new Date().getDay() + 6) % 7, today = DAYS[todayIdx];
  const todayItems = ((CFG.jeju?.waste?.days || {})[today] || '').split(/,\s*/).filter(Boolean);
  $('#todayLabel').textContent = `${today}요일 · ${CFG.jeju?.area || '제주시'}`;
  $('#quick').replaceChildren(...(CFG.tools || []).map((t) => {
    const a = document.createElement('a'); a.href = t.soon || !t.href ? '#' : t.href; a.className = t.soon ? 'soon' : '';
    if (t.soon || !t.href) a.onclick = (e) => { e.preventDefault(); toast('준비 중이에요'); };
    // '오늘 버릴 수 있는 것' 타일은 설명 자리에 오늘 품목을 바로 보여준다
    const sub = t.key === 'today' ? (todayItems.join(' · ') || '요일표 보기') : (t.sub || '');
    a.innerHTML = `<span class="qic">${icon(t.icon)}</span><span class="ql">${esc(t.label)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}`; return a;
  }));
}
let PLACES = [];
function renderPlaces(t) { $$('#homePlaceTabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t)); $('#places').replaceChildren(...PLACES.filter((p) => p.type === t).slice(0, 4).map((p, i) => placeCard(p, i + 1))); }
$$('#homePlaceTabs button').forEach((b) => b.onclick = () => renderPlaces(b.dataset.t));
async function load() {
  api('/api/places').then((d) => { PLACES = d.items || []; renderPlaces('spot'); });
  const [guides, all, h] = await Promise.all([api('/api/guides'), api('/api/projects'), api('/api/hackathons')]);
  const projects = all.filter((p) => p.type === 'project'), goods = all.filter((p) => p.type !== 'project');
  $('#projects').replaceChildren(...projects.slice(0, 3).map(listingCard));
  if (!projects.length) $('#projects').innerHTML = '<div class="empty">아직 넘길 프로젝트가 없어요. <a href="./sell.html?type=project">첫 프로젝트를 올려 보세요</a></div>';
  $('#hackList').replaceChildren(...(h.items || []).slice(0, 4).map((x) => { const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; a.innerHTML = `<span class="src ${x.source}">${x.source === 'local' ? '국내 · 직접 등록' : 'Devpost'}</span><b>${esc(x.title)}</b><span class="d">${esc(x.dates || '')} · ${esc(x.location || '')}${x.participants ? ` · ${x.participants.toLocaleString()}명 참가` : ''}</span><span class="p">${x.prize ? `상금 ${esc(x.prize)}` : ''}</span>`; return a; }));
  $('#support').replaceChildren(...(CFG.support || []).map((s) => { const a = document.createElement('a'); a.href = s.href; a.target = '_blank'; a.rel = 'noopener'; a.innerHTML = `<span class="org">${esc(s.org || '')}</span><b>${esc(s.title || '')}</b><span class="d">${esc(s.sub || '')}</span><span class="go">공식 사이트 ${icon('arrow')}</span>`; return a; }));
  $('#guides').replaceChildren(...guides.slice(0, 4).map(guideCard));
  $('#feed').replaceChildren(...goods.slice(0, 4).map(photoCard));
  if (!goods.length) $('#feed').innerHTML = '<div class="empty">아직 올라온 글이 없어요. <a href="./sell.html">첫 글을 올려 보세요</a></div>';
}
mountShell({ active: 'home', primary: 'browse', sub: 'home' }).then((c) => { CFG = c; renderCarousel(); renderQuick(); load(); });
</script>
</body>
</html>
