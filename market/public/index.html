<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>섬업 · 제주(섬)에서 창업을 거래하다</title>
<meta name="description" content="섬업. 제주에서 만든 AI 서비스와 해커톤 프로젝트를 사고팔고, 창업 지원사업·인사이트·해커톤 정보를 한곳에서.">
<meta name="theme-color" content="#08070b" id="themeColor">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body class="home dark-top">
<!-- 첫 화면: 빛줄기가 한 점으로 모이고 → 터지며 섬이 되고 → "섬업"이 써지고 → "업"이 올라간다 -->
<div class="herowrap" id="herowrap">
<div class="hero2" id="hero2">
  <canvas id="hfx" aria-hidden="true"></canvas>
  <b class="hword" id="hword" aria-hidden="true"><span>섬</span><u>업</u></b>
  <div class="wrap hin"><div class="htext" id="heroText">
    <span class="kicker" id="hk" data-edit="carousel.0.kicker">제주 창업 장터</span>
    <h1 id="hh" data-edit="carousel.0.title">제주(섬)에서<br><em>창업을 거래하다</em></h1>
    <p class="sub" id="hs" data-edit="carousel.0.sub">AI로 만든 서비스와 해커톤 프로젝트가 다음 주인을 만나는 곳.<br>흩어진 창업 정보가 한 줄기로 모입니다.</p>
    <div class="cta"><a class="btn primary" href="./market.html?type=project"><span id="hb1" data-edit="banner.primaryLabel">프로젝트 둘러보기</span></a><a class="btn line" href="./sell.html?type=project"><span id="hb2" data-edit="banner.secondaryLabel">내 프로젝트 올리기</span></a></div>
  </div></div>
  <button type="button" class="hreplay" id="hreplay" aria-label="애니메이션 다시 보기" title="다시 보기">↻</button>
  <a class="hscroll" href="#lead" aria-label="아래로 내려가기"></a>
</div>
</div>

<main class="wrap">
  <section><p class="home-lead" id="lead" data-edit="lead"></p></section>
  <section><div class="direction" id="direction"></div></section>
  <section>
    <div class="sec-head"><h2>어디로 갈까요</h2></div>
    <div class="ring" id="ring"></div>
  </section>
  <section>
    <div class="sec-head"><h2>Jeju Life</h2></div>
    <div class="tgroups" id="tiles"></div>
  </section>
</main>

<script>
let CFG;
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];

/* ── 첫 화면 애니메이션 ── */
function heroFx() {
  const hero = $('#hero2'), cv = $('#hfx'), word = $('#hword'), u = word.querySelector('u'), c = cv.getContext('2d');
  const ease = FX.ease, backOut = (x) => 1 + 2.7 * (x - 1) ** 3 + 1.7 * (x - 1) ** 2, mound = (x, cx, w) => Math.exp(-(((x - cx) / w) ** 2));
  const hh = (x) => .55 * mound(x, .57, .2) + .3 * mound(x, .27, .11);
  const small = innerWidth < 820, S = FX.makeStrands(small ? 120 : 200), P = [];
  for (let i = 0, n = small ? 950 : 1600; i < n; i++) { let x, y; do { x = Math.random(); y = Math.random() * .6; } while (y > hh(x)); P.push({ tx: x, ty: y, an: Math.random() * 6.28, rd: .12 + Math.random() * .6, ph: Math.random() * 6.28, col: ['#ff6b1a', '#ff6b1a', '#ffb347', '#19e0c8', '#ffffff'][i % 5], r: .8 + Math.random() * 1.8 }); }
  let W = 1, H = 1, D = 1, cx, cy, m, bw, bx, base, bh, t0 = performance.now(), first = true, seen = true;
  function layout() {
    ({ W, H, D } = FX.fit(cv, small ? 1.5 : 1.75)); const narrow = W < 820;
    const zone = narrow ? Math.max(180, ($('#heroText').getBoundingClientRect().top - hero.getBoundingClientRect().top) / (hero.__s || 1)) : H;
    cx = narrow ? W * .5 : W / 2 + Math.min(W, 1400) * .245; cy = zone * (narrow ? .34 : .4); m = Math.min(zone, W);
    bw = narrow ? Math.min(W * .9, 440) : Math.min(W * .42, 620); bx = cx - bw / 2; base = zone * (narrow ? .6 : .56); bh = zone * (narrow ? .8 : .5);
    word.style.fontSize = (narrow ? Math.max(40, Math.min(70, W * .16, zone * .27)) : Math.max(64, Math.min(112, W * .072))) + 'px';
    word.style.left = cx + 'px'; word.style.top = base + (narrow ? 10 : 34) + 'px'; first = true;
  }
  function frame(now) {
    const T = (now - t0) / 1000, tt = now / 1000;
    if (first) { c.setTransform(D, 0, 0, D, 0, 0); c.fillStyle = '#08070b'; c.fillRect(0, 0, W, H); first = false; }
    c.setTransform(D, 0, 0, D, 0, 0); c.fillStyle = `rgba(8,7,11,${T < 3.1 ? .18 : .4})`; c.fillRect(0, 0, W, H);
    const f = ease(T / 2.7), al = T < 3 ? ease(T / .5) : Math.max(.2 + Math.sin(tt * .8) * .05, 1 - ease((T - 3) / 1.5)), R = Math.hypot(W, H) * .62;
    c.globalCompositeOperation = 'lighter';
    FX.strands(c, S, cx, cy, R, tt, f, al);
    const fl = Math.max(0, 1 - Math.abs(T - 3.05) / .42), gr = m * (.04 + .3 * f) * (1 + fl * 1.6), g2 = c.createRadialGradient(cx, cy, 0, cx, cy, gr);
    g2.addColorStop(0, `rgba(255,${190 + fl * 60 | 0},${120 + fl * 130 | 0},${.42 * al * f + fl * .9})`); g2.addColorStop(1, 'rgba(255,107,26,0)'); c.fillStyle = g2; c.beginPath(); c.arc(cx, cy, gr, 0, 6.3); c.fill();
    const rp = (T - 3.05) / 1.25; if (rp > 0 && rp < 1) { c.strokeStyle = `rgba(255,190,120,${(1 - rp) * .8})`; c.lineWidth = 3 + (1 - rp) * 8; c.beginPath(); c.arc(cx, cy, rp * Math.max(W, H) * .6, 0, 6.3); c.stroke(); }
    c.globalCompositeOperation = 'source-over';
    const a = ease((T - 2.95) / .9), b = ease((T - 3.75) / 2.2);
    if (a > 0) {
      for (const p of P) { const sx = cx + Math.cos(p.an) * p.rd * m * 1.1, sy = cy + Math.sin(p.an) * p.rd * m * .75, tx = bx + p.tx * bw, ty = base - p.ty * bh + Math.sin(tt * 1.5 + p.ph) * 1.6; let x = cx + (sx - cx) * a, y = cy + (sy - cy) * a; x += (tx - x) * b; y += (ty - y) * b;
        c.globalAlpha = a; c.fillStyle = p.col; c.beginPath(); c.arc(x, y, p.r * (1 + (1 - b) * .8), 0, 6.3); c.fill(); }
      c.globalAlpha = b * .7; c.strokeStyle = '#19e0c8'; c.lineWidth = 1.5; c.beginPath(); const x1 = Math.max(0, bx - bw * .25), x2 = Math.min(W, bx + bw * 1.25); for (let x = x1; x <= x2; x += 10) { const y = base + 8 + Math.sin(x * .02 + tt * 1.4) * 3; x === x1 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); c.globalAlpha = 1;
    }
    // 글자: 써지고 → '업'이 올라간다. 그 뒤로는 가끔 한 번씩 톡 튄다
    const r = ease((T - 5.5) / .9), hop = T > 9 ? (T - 9) % 7 : 9, l = T < 6.7 ? 0 : backOut(Math.min(1, (T - 6.7) / .7)) + (hop < .7 ? Math.sin(hop / .7 * Math.PI) * .45 : 0);
    word.style.opacity = r > 0 ? 1 : 0; word.style.clipPath = `inset(-90% ${(1 - r) * 125 - 25}% -70% -25%)`; u.style.transform = `translateY(${-.24 * l}em)`; u.style.color = l > .3 ? '#ff6b1a' : '#fff';
    const sp = T < 6.7 ? 0 : T < 8.6 ? 1 - (T - 6.7) / 1.9 : hop < 1.3 ? 1 - hop / 1.3 : 0;
    if (sp > 0) { const ur = u.getBoundingClientRect(), cr = cv.getBoundingClientRect(), k = hero.__s || 1, ux = (ur.left + ur.width / 2 - cr.left) / k, uy = (ur.top - cr.top) / k;
      for (let i = 0; i < 16; i++) { const ph = (tt * .9 + i / 16) % 1; c.globalAlpha = (1 - ph) * sp; c.fillStyle = i % 3 ? '#ff6b1a' : '#ffb347'; c.beginPath(); c.arc(ux + Math.sin(i * 2.4) * ur.width * .5, uy - ph * bh * .5, 1.8 + (1 - ph) * 1.6, 0, 6.3); c.fill(); } c.globalAlpha = 1; }
  }
  layout(); new ResizeObserver(layout).observe(hero); setTimeout(layout, 900);
  if (FX.reduced()) { t0 = performance.now() - 60000; for (let i = 0; i < 12; i++) frame(performance.now()); return; }
  new IntersectionObserver((es) => { seen = es[0].isIntersecting; }).observe(hero);
  const loop = (now) => { if (seen && !document.hidden) frame(now); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
  $('#hreplay').onclick = () => { t0 = performance.now(); first = true; };
}

function renderHero() {
  const s = (CFG.carousel || [])[0] || {}, B = CFG.banner || {};
  if (s.kicker) $('#hk').textContent = s.kicker; if (s.title) $('#hh').innerHTML = rich(s.title); if (s.sub) $('#hs').innerHTML = rich(s.sub);
  if (B.primaryLabel) $('#hb1').textContent = B.primaryLabel; if (B.secondaryLabel) $('#hb2').textContent = B.secondaryLabel;
  $('#lead').innerHTML = rich(CFG.lead || '');
}
function renderRing() {
  $('#ring').replaceChildren(...(CFG.ring || []).map((r, i) => { const a = document.createElement('a'); a.href = r.href; a.innerHTML = `<span class="rimg">${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy">` : ''}</span><b data-edit="ring.${i}.label">${esc(r.label)}</b><small data-edit="ring.${i}.sub">${esc(r.sub || '')}</small>`; return a; }));
}
function renderDirection() {
  const D = CFG.direction; if (!D) { $('#direction').parentElement.hidden = true; return; }
  $('#direction').innerHTML = `<div><p class="kicker" data-edit="direction.kicker">${esc(D.kicker || '')}</p><h2 data-edit="direction.title">${rich(D.title || '')}</h2></div><a class="dmore" href="./board.html?kind=insight">인사이트 더 보기 ${icon('arrow')}</a><div class="facts">${(D.facts || []).map((f, i) => `<a href="${f.post ? `./post.html?kind=insight&id=${encodeURIComponent(f.post)}` : esc(f.href || '#')}" ${f.post ? '' : 'target="_blank" rel="noopener"'} style="${f.image ? `background-image:url('${esc(f.image)}')` : ''}"><div><b data-edit="direction.facts.${i}.num">${esc(f.num)}</b><span data-edit="direction.facts.${i}.label">${rich(f.label)}</span><small>${esc(f.src || '')} · 기사 보기 ${icon('arrow')}</small></div></a>`).join('')}</div>`;
  // 숫자는 화면에 들어올 때 올라가며 나타난다
  if ('IntersectionObserver' in window) { const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.querySelectorAll('.facts b').forEach(FX.count); io.disconnect(); } }), { threshold: .3 }); io.observe($('#direction')); }
}
function renderTiles() {
  const today = DAYS[(new Date().getDay() + 6) % 7]; const first = ((CFG.jeju?.waste?.days || {})[today] || '').split(/,\s*/)[0] || '';
  tileGroups($('#tiles'), CFG.tiles, { today: `${today}요일 · ${first}` });
}
heroFx();
// 좌우 안내 배너는 첫 화면을 지난 뒤에 나타난다
/* 내리면 첫 화면이 카드처럼 작아지고, 배경이 검정에서 흰색으로 바뀐다 */
const heroScroll = () => {
  const wrap = $('#herowrap'), hero = $('#hero2'), root = document.documentElement, hh = wrap.offsetTop;
  root.style.setProperty('--hh', hh + 'px');
  const x = Math.max(0, Math.min(1, scrollY / (innerHeight * .5))), e = x * x * (3 - 2 * x), sc = 1 - (innerWidth < 820 ? .1 : .14) * e;
  root.style.setProperty('--hp', e.toFixed(3)); hero.style.setProperty('--hs', sc.toFixed(4)); hero.style.setProperty('--hr', (e * (innerWidth < 820 ? 28 : 40)).toFixed(1) + 'px'); hero.__s = sc;
  document.body.classList.toggle('dark-top', e < .6); document.body.classList.toggle('past', scrollY > wrap.offsetHeight - 160);
  const tc = $('#themeColor'); if (tc) tc.content = e < .6 ? '#08070b' : '#ffffff';
};
addEventListener('scroll', heroScroll, { passive: true }); addEventListener('resize', heroScroll); heroScroll(); setTimeout(heroScroll, 400);
$('.hscroll').onclick = (e) => { e.preventDefault(); $('#lead').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
mountShell({ active: 'home' }).then((c) => { CFG = c; renderHero(); renderRing(); renderDirection(); renderTiles(); });
</script>
</body>
</html>
