<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 교통 · 섬업</title>
<meta name="description" content="제주 도로 통제, 실시간 교통, 전기차 충전소를 한곳에서.">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap" style="max-width:860px">
  <div class="page-title"><h1 id="trH1">교통</h1><p id="trSub">제주 도로와 충전소의 지금.</p></div>
  <div class="livecards" id="livecards" style="margin-top:16px">
    <a href="./info.html?kind=road" data-k="road"><small>도로 통제</small><b>보기</b><span>지금 통제 중인 도로</span></a>
    <a href="./info.html?kind=ev" data-k="ev"><small>전기차 충전소</small><b>보기</b><span>충전소 위치와 지도</span></a>
  </div>
  <section id="sec-flow" hidden>
    <div class="sec-head"><h2 id="trFlow">지금 도로 흐름</h2><span class="more" id="flowAt"></span></div>
    <div class="flowbox"><div class="flowavg"><small>제주 전체 평균</small><b id="flowAvg"></b><span id="flowLinks"></span></div>
      <div class="flowbars"><div class="flowbar" id="flowBar"></div><div class="flowlegend" id="flowLegend"></div></div></div>
    <p class="note" style="margin-top:10px">구간마다 잰 속도를 모은 값이에요. 시속 15km 미만은 정체, 25km 미만은 서행, 그 이상은 원활로 나눴어요.</p>
  </section>
  <section id="sec-road" hidden>
    <div class="sec-head"><h2 id="trRoad">지금 도로 통제</h2><span class="more"></span></div>
    <div class="list"></div>
    <button type="button" class="btn itsmore" style="margin-top:12px" hidden>전체 보기</button>
    <p class="note" style="margin-top:10px"></p>
  </section>
  <section id="sec-ev" hidden>
    <div class="sec-head"><h2 id="trEv">전기차 충전소</h2><span class="more"></span></div>
    <div class="list"></div>
    <button type="button" class="btn itsmore" style="margin-top:12px" hidden>전체 보기</button>
    <p class="note" style="margin-top:10px"></p>
  </section>
  <p class="note" style="margin-top:18px">자료: 제주특별자치도 교통정보센터 OPEN API. 10분마다 새로 받아와요.</p>
</main>
<script>
mountShell({ active: 'jeju', sub: 'traffic' }).then(() => {
  api('/api/jeju/live').then((v) => { const T = { road: (n) => (n ? `${n}건` : '통제 없음'), traffic: (n) => `${n.toLocaleString('ko-KR')}구간`, ev: (n) => `${n.toLocaleString('ko-KR')}곳` };
    $$('#livecards a').forEach((a) => { const n = v[a.dataset.k]; if (n !== null && n !== undefined) { a.querySelector('b').textContent = T[a.dataset.k](n); } });
    const f = v.flow; if (f && f.links) { const pc = (n) => Math.round((n / f.links) * 100); $('#sec-flow').hidden = false; $('#flowAvg').textContent = `시속 ${f.avg}km`; $('#flowLinks').textContent = `${f.links.toLocaleString('ko-KR')}개 구간`; $('#flowAt').textContent = f.at ? `${f.at} 기준` : '';
      $('#flowBar').innerHTML = [['free', f.free], ['slow', f.slow], ['jam', f.jam]].map(([c, n]) => `<i class="${c}" style="width:${(n / f.links) * 100}%"></i>`).join('');
      $('#flowLegend').innerHTML = [['free', '원활', f.free], ['slow', '서행', f.slow], ['jam', '정체', f.jam]].map(([c, t, n]) => `<span><i class="${c}"></i>${t} ${pc(n)}% <small>${n.toLocaleString('ko-KR')}구간</small></span>`).join(''); } }).catch(() => {});
  itsSection($('#sec-road'), 'road'); itsSection($('#sec-ev'), 'ev');
});
</script>
</body>
</html>
