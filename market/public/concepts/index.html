<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>홈 시안 모음</title><link rel="stylesheet" href="./c.css">
<style>body{padding:48px 24px}h1{font-size:32px;font-weight:900;margin-bottom:8px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:28px;max-width:1200px}.g a{display:block;border-radius:16px;overflow:hidden;background:#fff;border:1px solid #e9e3da;transition:transform .15s}.g a:hover{transform:translateY(-4px)}.g iframe{width:200%;height:360px;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none;display:block}.g .f{height:180px;overflow:hidden}.g b{display:block;padding:14px 16px 2px;font-size:18px}.g p{padding:0 16px 16px;color:#8a8178;font-size:14px}</style></head><body>
<h1>홈 시안 모음</h1><p>눌러서 직접 스크롤해 보세요. 마음에 드는 번호나 섞고 싶은 부분을 알려 주세요.</p><div class="g" id="g"></div>
<script>const L=[['a','A · 열리는 창','스크롤하면 가운데 사진이 화면 가득 열려요'],['b','B · 화면 가득 영상','영상 위에 큰 제목, 단어가 바뀌어요'],['c','C · 볼드 팝','주황 바탕, 기울어진 영상 틀, 흐르는 카드'],['d','D · 빛줄기','어두운 바탕에 빛이 한 점으로 모여요'],['e','E · 팝 스티커','심볼이 커지며 영상이 열리고, 누르면 색이 바뀌어요'],['f','F · 돌아가는 고리','프로젝트 카드가 입체로 돌아요'],['g','G · 움직이는 글자','큰 글자가 좌우로 흐르고 카드가 옆으로 넘어가요']];
g.innerHTML=L.map(([k,t,d])=>`<a href="./${k}.html"><div class="f"><iframe src="./${k}.html" loading="lazy" tabindex="-1"></iframe></div><b>${t}</b><p>${d}</p></a>`).join('');</script></body></html>
