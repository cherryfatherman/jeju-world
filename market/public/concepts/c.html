<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안 C · 볼드 팝</title><link rel="stylesheet" href="./c.css">
<style>
body{background:#ff6b1a}.nav{mix-blend-mode:normal;color:#1b1915}
.hero{min-height:100vh;padding:120px 6vw 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;overflow:hidden}
h1{font-size:clamp(44px,6.8vw,108px);font-weight:900;line-height:1.02;color:#1b1915;white-space:nowrap}h1 i{font-style:normal;color:#fff;display:inline-block;animation:pop 2.4s ease-in-out infinite}@keyframes pop{50%{transform:rotate(-3deg) scale(1.04)}}
.sub{font-size:clamp(17px,1.7vw,24px);font-weight:700;margin:26px 0 30px;color:#1b1915}.btn{background:#1b1915}.btn.line{color:#1b1915}
.frame{position:relative;aspect-ratio:4/5;border-radius:36px;overflow:hidden;transform:rotate(4deg);box-shadow:16px 16px 0 #1b1915;border:4px solid #1b1915;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:rotate(2deg) translateY(-14px)}}
.stk{position:absolute;z-index:3;background:#fff;border:3px solid #1b1915;border-radius:999px;padding:10px 18px;font-weight:900;font-size:16px;box-shadow:5px 5px 0 #1b1915}.stk.a{left:-18px;top:14%;transform:rotate(-8deg);animation:wig 3s ease-in-out infinite}.stk.b{right:-14px;bottom:16%;background:#19b3a6;color:#fff;transform:rotate(6deg);animation:wig 3.6s ease-in-out infinite reverse}@keyframes wig{50%{transform:rotate(4deg) translateY(-6px)}}
.band{background:#1b1915;padding:26px 0;display:grid;gap:14px}.card{display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 18px 10px 10px;font-weight:800;font-size:17px}.card img{width:48px;height:48px;border-radius:12px;object-fit:cover}.card u{text-decoration:none;color:#ff6b1a}
section{padding:110px 0;background:#faf8f5}h2{font-size:clamp(28px,4vw,48px);font-weight:900;margin-bottom:36px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:100px}.frame{max-width:320px;margin:0 auto}}
</style></head><body>
<div id="nav"></div>
<header class="hero"><div><h1>제주(섬)에서<br>창업을 <i>거래</i>하다</h1><p class="sub">멈춘 프로젝트, 다음 주인 찾아 드려요.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="../market.html?type=project">프로젝트 둘러보기</a><a class="btn line" href="../sell.html?type=project">내 것 올리기</a></div></div>
<div style="position:relative"><div class="frame"><div class="media" id="media"></div></div><span class="stk a">사진만 올리면 끝</span><span class="stk b">AI가 30초 만에</span></div></header>
<div class="band"><div class="mq"><div id="m1"></div></div><div class="mq rev"><div id="m2"></div></div></div>
<section><div class="wrap"><h2 class="reveal">제주는 지금 <em>창업도시</em>에 도전 중</h2><div id="facts"></div></div></section>
<section style="padding-top:0"><div class="wrap"><h2 class="reveal">지금 추천 많은 프로젝트</h2><div class="rows" id="rows"></div></div></section>
<span class="tag">시안 C · 볼드 팝</span>
<script src="./c.js"></script><script>
nav.innerHTML = NAV; facts.innerHTML = FACTS; mountMedia(media);
projects().then((l) => { rows.innerHTML = rowsHTML(l); const c = l.map((p) => `<span class="card"><img src="${esc((p.photos || [])[0] || '')}" alt="">${esc(p.name)} <u>추천 ${p.interest}</u></span>`).join(''); m1.innerHTML = c + c + c + c; m2.innerHTML = c + c + c + c; reveal(); });
</script></body></html>
