<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안 E · 팝 스티커</title><link rel="stylesheet" href="./c.css">
<style>
:root{--c:#ffd23f}body{background:#f4efe6;transition:background .4s}.nav{mix-blend-mode:normal;color:#111}
.stage{height:300vh;position:relative}.pin{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center;background:var(--c);transition:background .4s}
.obj{position:absolute;width:min(34vh,300px);transform:rotate(calc(-14deg + 28deg*var(--p))) scale(calc(1 + 2.6*var(--z)));filter:drop-shadow(14px 18px 0 rgba(0,0,0,.18));opacity:calc(1 - var(--o));will-change:transform}
.ttl{position:absolute;font-size:clamp(46px,11vw,170px);font-weight:900;line-height:.9;color:#111;white-space:nowrap;opacity:calc(1 - var(--z)*3)}.ttl.t{top:13vh;transform:translateX(calc(-30vw*var(--p)))}.ttl.b{bottom:11vh;transform:translateX(calc(30vw*var(--p)))}
.win{position:absolute;inset:calc(12vh*(1 - var(--o))) calc(10vw*(1 - var(--o)));border-radius:calc(28px*(1 - var(--o)));overflow:hidden;border:4px solid #111;opacity:var(--o);box-shadow:10px 10px 0 #111}
.win p{position:absolute;z-index:2;left:0;right:0;bottom:9vh;text-align:center;color:#fff;font-size:clamp(24px,3.6vw,54px);font-weight:900;text-shadow:0 3px 24px rgba(0,0,0,.6)}
section{padding:100px 0}h2{font-size:clamp(34px,6vw,84px);font-weight:900;line-height:.98;margin-bottom:14px;color:#111}h2 s{text-decoration:none;-webkit-text-stroke:2.5px #111;color:transparent}
.lab{display:inline-block;background:#111;color:var(--c);font-weight:900;font-size:12px;padding:5px 10px;border-radius:6px;margin-bottom:14px;transition:color .4s}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:30px}.pk{background:#fff;border:3px solid #111;border-radius:14px;box-shadow:6px 6px 0 #111;padding:14px;text-align:center;cursor:pointer;transition:transform .15s,background .3s}.pk:hover{transform:translate(-3px,-3px)}.pk.on{background:var(--c)}.pk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid #111}.pk b{display:block;font-size:18px;font-weight:900;margin-top:10px}.pk small{font-size:12px;color:#555}
.det{margin-top:18px;background:var(--c);border:3px solid #111;border-radius:16px;box-shadow:8px 8px 0 #111;padding:28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;transition:background .4s}.det b{font-size:clamp(26px,3.6vw,46px);font-weight:900}.det p{font-size:17px;font-weight:700;margin-top:6px}.det .btn{background:#111;border-radius:12px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:560px;overflow:hidden;margin-top:30px;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}.col{display:grid;gap:16px;align-content:start;animation:vs 26s linear infinite}.col:nth-child(2){animation-direction:reverse;animation-duration:32s}@keyframes vs{to{transform:translateY(-50%)}}
.cd{display:block;background:#fff;border:3px solid #111;border-radius:12px;box-shadow:5px 5px 0 #111;padding:16px}.cd b{font-size:18px;font-weight:900}.cd p{font-size:14px;margin-top:6px;color:#333}.cd u{display:inline-block;margin-top:12px;text-decoration:none;font-weight:900;font-size:13px;background:var(--c);border:2px solid #111;border-radius:999px;padding:3px 10px}
@media(max-width:760px){.pick{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr 1fr}.col:nth-child(3){display:none}}
</style></head><body>
<div id="nav"></div>
<div class="stage" id="stage"><div class="pin"><div class="ttl t">제주(섬)에서</div><div class="ttl b">창업을 거래하다</div>
<svg class="obj" viewBox="0 0 100 100"><rect x="18" y="8" width="64" height="84" rx="10" fill="#ff6b1a" stroke="#111" stroke-width="3"/><path d="M62 8h12v32l-6-5-6 5z" fill="#111"/><circle cx="46" cy="58" r="17" fill="#fff" stroke="#111" stroke-width="3"/><path d="M46 42c0-5 5-9 12-8-1 6-6 9-12 8z" fill="#19b3a6" stroke="#111" stroke-width="2.5"/></svg>
<div class="win"><div class="media" id="media"></div><p>멈춘 프로젝트가 다음 주인을 만나요</p></div></div></div>
<section><div class="wrap"><span class="lab">다섯 줄기</span><h2 class="reveal">다섯 갈래.<br><s>한</s> 곳에서.</h2><p style="font-weight:700">하나를 누르면 화면 전체가 그 색으로 바뀌어요.</p><div class="pick" id="pick"></div><div class="det" id="det"></div></div></section>
<section style="padding-top:0"><div class="wrap"><span class="lab">장터</span><h2 class="reveal">지금 올라온<br>프로젝트.</h2><div class="cols" id="cols"></div></div></section>
<span class="tag">시안 E · 팝 스티커</span>
<script src="./c.js"></script><script>
nav.innerHTML = NAV; mountMedia(media);
const st = document.getElementById('stage'); const on = () => { const r = st.getBoundingClientRect(); const p = Math.max(0, Math.min(1, -r.top / (r.height - innerHeight))); st.style.setProperty('--p', p); st.style.setProperty('--z', Math.max(0, Math.min(1, (p - .25) / .35))); st.style.setProperty('--o', Math.max(0, Math.min(1, (p - .5) / .3))); }; addEventListener('scroll', on, { passive: true }); on();
const P = [['장터', '프로젝트 거래', '#ffd23f', 'photo-1517694712202-14dd9538aa97', '../market.html?type=project', 'AI 서비스·해커톤 프로젝트를 사고팔아요.'], ['창업마당', '지원사업·자금', '#5ee6c8', 'photo-1579621970563-ebec7560ff3e', '../board.html?kind=program', '제주에서 받을 수 있는 지원사업을 한곳에.'], ['인사이트', '논문·통계', '#b9a6ff', 'photo-1481627834876-b7833e8f5570', '../board.html?kind=insight', '창업에 도움이 되는 자료를 읽기 쉽게.'], ['해커톤', '일정·수상작', '#ff8fb1', 'photo-1531482615713-2afd69097998', '../hackathon.html', '지금 열려 있는 해커톤과 수상작 도감.'], ['제주마당', '생활·여행', '#7cc6ff', 'photo-1507525428034-b723cf961d3e', '../jeju.html', '도민이 매일 찾는 생활 정보.']];
function sel(i) { const x = P[i]; document.documentElement.style.setProperty('--c', x[2]); [...pick.children].forEach((e, k) => e.classList.toggle('on', k === i)); det.innerHTML = `<div><b>${x[0]}</b><p>${x[5]}</p></div><a class="btn" href="${x[4]}">${x[0]} 가기 →</a>`; }
pick.innerHTML = P.map((x) => `<div class="pk"><img src="https://images.unsplash.com/${x[3]}?w=300&h=300&fit=crop&q=70&auto=format" alt=""><b>${x[0]}</b><small>${x[1]}</small></div>`).join(''); [...pick.children].forEach((e, i) => e.onclick = () => sel(i)); sel(0);
projects().then((l) => { const card = (p) => `<a class="cd" href="../project.html?id=${encodeURIComponent(p.id)}"><b>${esc(p.name)}</b><p>${esc(p.tagline || '')}</p><u>추천 ${p.interest}</u></a>`; cols.innerHTML = [0, 1, 2].map((k) => { const s = l.slice(k).concat(l.slice(0, k)).map(card).join(''); return `<div class="col">${s}${s}${s}${s}</div>`; }).join(''); reveal(); });
</script></body></html>
