  // 4. 한 줄기

    const S = Array.from({ length: 170 }, () => ({ a: Math.random() * 6.28, r: .55 + Math.random() * .6, sp: .2 + Math.random() * .6, w: .4 + Math.random() * 1.5, hue: Math.random(), bend: (Math.random() - .5) * 1.6 })); let first = true;
