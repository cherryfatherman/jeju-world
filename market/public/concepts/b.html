<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시안 B · 화면 가득 영상</title><link rel="stylesheet" href="./c.css">
<style>
.hero{position:relative;height:100vh;min-height:620px;color:#fff;display:flex;align-items:flex-end}.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,13,.35),rgba(20,17,13,.2) 40%,rgba(20,17,13,.88))}
.in{position:relative;z-index:2;width:100%;padding:0 6vw 150px}.k{font-weight:800;color:#ffb48a;font-size:15px;margin-bottom:16px}
h1{font-size:clamp(44px,8vw,120px);font-weight:900;line-height:1.02}h1 .w{display:inline-block;color:#ff6b1a;min-width:4.2em}h1 .w span{display:inline-block;animation:up .5s cubic-bezier(.2,.7,.2,1)}@keyframes up{from{transform:translateY(60%);opacity:0}}
.sub{font-size:clamp(16px,1.6vw,22px);margin:22px 0 30px;opacity:.9;line-height:1.5}.cta{display:flex;gap:12px;flex-wrap:wrap}
.tick{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:18px 0;border-top:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);background:rgba(20,17,13,.35)}.tick span{font-weight:700;font-size:15px;display:inline-flex;gap:10px;align-items:center}.tick span::before{content:'';width:8px;height:8px;border-radius:50%;background:#ff6b1a}
section{padding:110px 0}h2{font-size:clamp(28px,4vw,48px);font-weight:900;margin-bottom:36px}
.dark{background:#14110d;color:#fff}.dark .fact span{color:rgba(255,255,255,.75)}
</style></head><body>
<div id="nav"></div>
<header class="hero"><div class="media" id="media"></div><div class="in"><p class="k">제주 창업 장터</p><h1>제주(섬)에서<br><span class="w" id="w"><span>창업을</span></span> 거래하다</h1>
<p class="sub">AI로 만든 서비스와 해커톤 프로젝트가 다음 주인을 만나는 곳.</p><div class="cta"><a class="btn" href="../market.html?type=project">프로젝트 둘러보기</a><a class="btn line" href="../sell.html?type=project">내 프로젝트 올리기</a></div></div>
<div class="tick mq"><div id="tick"></div></div></header>
<section class="dark"><div class="wrap"><h2 class="reveal">제주는 지금 <em>창업도시</em>에 도전 중</h2><div id="facts"></div></div></section>
<section><div class="wrap"><h2 class="reveal">지금 추천 많은 프로젝트</h2><div class="rows" id="rows"></div></div></section>
<span class="tag">시안 B · 화면 가득 영상</span>
<script src="./c.js"></script><script>
nav.innerHTML = NAV; facts.innerHTML = FACTS; mountMedia(media);
const words = ['창업을', '프로젝트를', '아이디어를', '해커톤을']; let i = 0; setInterval(() => { i = (i + 1) % words.length; w.innerHTML = `<span>${words[i]}</span>`; }, 2200);
projects().then((l) => { rows.innerHTML = rowsHTML(l); const t = l.map((p) => `<span>${esc(p.name)} · 추천 ${p.interest}</span>`).join(''); tick.innerHTML = t + t + t + t; reveal(); });
</script></body></html>
