<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주마당 · 섬업</title>
<meta name="description" content="제주 요일별 분리배출, 이거 어디 버려요? AI, 도민 생활정보를 한곳에서.">
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap" style="max-width:860px">
  <div class="page-title"><h1>생활</h1><p>도민 생활정보.</p></div>
  <div class="tgroups" id="tiles" style="margin-top:16px"></div>

  <section id="waste">
    <div class="sec-head"><h2>이거 어디 버려요?</h2><span class="more" id="area"></span></div>
    <form class="form" id="wasteForm">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><input name="q" required maxlength="200" placeholder="예: 깨진 유리컵, 아이스팩, 스티로폼 박스" style="flex:1;min-width:200px"><button class="btn primary" id="askBtn">AI에게 묻기</button></div>
      <div class="chips" style="margin:0"><button type="button" class="chip" data-q="아이스팩">아이스팩</button><button type="button" class="chip" data-q="깨진 유리컵">깨진 유리컵</button><button type="button" class="chip" data-q="택배 상자">택배 상자</button><button type="button" class="chip" data-q="페트병">페트병</button><button type="button" class="chip" data-q="헌 옷">헌 옷</button><button type="button" class="chip" data-q="건전지">건전지</button></div>
      <div id="answer" hidden></div>
    </form>
  </section>

  <section id="sec-days">
    <div class="sec-head"><h2>요일별 배출</h2><span class="more" id="today"></span></div>
    <div class="days" id="days"></div>
    <div class="chips" id="daily" style="margin:12px 0 0"></div>
    <p class="note" id="wasteNote" style="margin-top:10px"></p>
    <p class="note" id="wasteSource"></p>
  </section>

  <section id="sec-road" hidden>
    <div class="sec-head"><h2>지금 도로 통제</h2><span class="more"></span></div>
    <div class="list"></div>
    <button type="button" class="btn itsmore" style="margin-top:12px" hidden>전체 보기</button>
    <p class="note" style="margin-top:10px"></p>
  </section>

  <section id="sec-ev" hidden>
    <div class="sec-head"><h2>전기차 충전소</h2><span class="more"></span></div>
    <div class="list"></div>
    <button type="button" class="btn itsmore" style="margin-top:12px" hidden>전체 보기</button>
    <p class="note" style="margin-top:10px"></p>
  </section>

  <section id="sec-guides">
    <div class="sec-head"><h2>생활정보</h2><span class="more">추천순</span></div>
    <div class="rlist" id="guides"></div>
  </section>

  <section id="sec-tips">
    <div class="sec-head"><h2>한 줄 팁</h2></div>
    <div class="list" id="tips"></div>
  </section>
</main>
<script>
let CFG;
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
function renderWaste() {
  const J = CFG.jeju || {}, W = J.waste || {};
  const todayIdx = (new Date().getDay() + 6) % 7;
  $('#area').textContent = `${J.area || '제주시'} 기준`;
  $('#today').textContent = `오늘은 ${DAYS[todayIdx]}요일`;
  $('#days').replaceChildren(...DAYS.map((d, i) => { const el = document.createElement('div'); el.className = 'day' + (i === todayIdx ? ' today' : ''); el.innerHTML = `<b>${d}</b><span>${esc((W.days || {})[d] || '-')}</span>`; return el; }));
  $('#daily').innerHTML = (W.daily || []).length ? `<span class="note" style="align-self:center;margin-right:4px">매일 배출</span>${W.daily.map((x) => `<span class="chip" style="cursor:default">${esc(x)}</span>`).join('')}` : '';
  $('#wasteNote').textContent = W.notes || '';
  $('#wasteSource').innerHTML = `출처: ${W.sourceUrl ? `<a href="${esc(W.sourceUrl)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(W.source || '')}</a>` : esc(W.source || '')}${W.lastChecked ? ` · 업데이트 ${esc(W.lastChecked)}` : ''}`;
  $('#tips').replaceChildren(...(J.tips || []).map((t) => { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = `<div class="body"><b>${esc(t.title)}</b><p>${esc(t.body)}</p></div>`; return d; }));
  const today = DAYS[todayIdx]; tileGroups($('#tiles'), (CFG.tiles || []).filter((g) => g.name === '생활'), { today: `${today}요일 · ${((W.days || {})[today] || '').split(/,\s*/)[0] || ''}` });
}
$('#wasteForm').onsubmit = async (e) => {
  e.preventDefault();
  const q = new FormData(e.target).get('q').trim(); if (!q) return;
  const btn = $('#askBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const d = await api('/api/jeju/waste', { question: q });
    $('#answer').hidden = false;
    $('#answer').innerHTML = `<div class="ai-box"><b>${esc(q)}</b> ${d.canToday === true ? '<span class="badge" style="color:var(--ok)">오늘 배출 가능</span>' : d.canToday === false ? `<span class="badge">오늘 ✕${d.nextDay ? ` · ${esc(d.nextDay)}요일 가능` : ''}</span>` : ''}<p style="margin:8px 0 0;white-space:pre-line">${esc(d.answer)}</p>${d.caution ? `<p class="note" style="margin-top:6px">${esc(d.caution)}</p>` : ''}</div>`;
  } catch (err) { toast(err.message); }
  btn.disabled = false; btn.textContent = 'AI에게 묻기';
};
$$('[data-q]').forEach((b) => b.onclick = () => { $('#wasteForm [name=q]').value = b.dataset.q; $('#wasteForm').requestSubmit(); });
mountShell({ active: 'jeju', sub: 'jeju' }).then((c) => { CFG = c; renderWaste(); api('/api/guides').then((g) => $('#guides').replaceChildren(...g.map((x, i) => guideRow(x, i + 1)))); if (location.hash) setTimeout(() => document.querySelector(location.hash)?.scrollIntoView(), 300); });
</script>
</body>
</html>
