<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제주 생활 가이드 · 바톤</title>
<link rel="stylesheet" href="./style.css">
<script src="./app.js"></script>
</head>
<body>
<main class="wrap" style="max-width:760px">
  <article class="guide" id="guide">
    <p class="crumb"><a href="./jeju.html">제주 생활</a> <span>›</span> <span id="crumbTag"></span></p>
    <h1 id="gTitle"></h1>
    <p class="lead" id="gSummary"></p>
    <div class="gmeta" id="gMeta"></div>
    <img class="ghero" id="gImage" alt="" hidden>
    <div class="prose" id="gBody"></div>
    <div class="gsources" id="gSources"></div>
    <div class="gfoot">
      <span>틀린 내용이 있나요? 알려주시면 바로 고칠게요.</span>
      <a class="btn sm" id="reportBtn" href="#">알려주기</a>
    </div>
  </article>
  <section>
    <div class="sec-head"><h2>다른 가이드</h2><a class="more" href="./jeju.html#sec-guides">전체 보기</a></div>
    <div class="ggrid" id="more"></div>
  </section>
</main>
<script>
const id = new URLSearchParams(location.search).get('id');
mountShell({ active: 'jeju', primary: 'jeju' }).then(async (c) => {
  let g; try { g = await api(`/api/guides/${encodeURIComponent(id || '')}`); } catch { $('#guide').innerHTML = '<div class="empty">찾는 가이드가 없어요. <a href="./jeju.html">제주 생활로 돌아가기</a></div>'; return; }
  document.title = `${g.title} · 바톤`;
  $('#crumbTag').textContent = g.tag || '가이드';
  $('#gTitle').textContent = g.title; $('#gSummary').textContent = g.summary || '';
  $('#gMeta').innerHTML = `${g.verified ? '<span class="badge" style="color:var(--ok)">공식 안내로 확인됨</span>' : '<span class="badge sample">확인 필요 · 초안</span>'}<span class="note">마지막 확인 ${esc(g.lastChecked || '-')}</span>`;
  if (g.image) { $('#gImage').src = g.image; $('#gImage').hidden = false; }
  $('#gBody').innerHTML = md(g.body || '');
  if (g.sources?.length) $('#gSources').innerHTML = `<b>출처·공식 안내</b><ul>${g.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join('')}</ul>`;
  $('#reportBtn').href = c.site.threads || '#';
  $('#reportBtn').target = '_blank';
  const all = await api('/api/guides');
  $('#more').replaceChildren(...all.filter((x) => x.id !== g.id).slice(0, 3).map(guideCard));
});
</script>
</body>
</html>
