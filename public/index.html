<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>제주 월드 - 성산일출봉 광장</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: -apple-system, "Noto Sans KR", sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 10px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 14px; pointer-events: none; }
  #hud b { font-size: 16px; }
  #chatlog { position: fixed; left: 10px; bottom: 64px; width: min(420px, calc(100vw - 20px)); max-height: 30vh; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; pointer-events: none; }
  .msg { background: rgba(0,0,0,.45); color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 14px; width: fit-content; max-width: 100%; word-break: break-all; }
  .msg .n { color: #ffd54f; margin-right: 6px; font-weight: 600; }
  .msg.sys { background: rgba(30,90,160,.55); }
  #bar { position: fixed; left: 10px; bottom: 10px; width: min(420px, calc(100vw - 20px)); display: flex; gap: 6px; }
  #bar input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 0; font-size: 16px; }
  #bar button { padding: 10px 14px; border-radius: 10px; border: 0; background: #ff7043; color: #fff; font-size: 15px; font-weight: 700; }
  #nameBtn { position: fixed; top: 10px; right: 10px; padding: 8px 12px; border-radius: 10px; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 13px; }
</style>
</head>
<body>
<div id="hud"><b>🌋 제주 월드 · 성산일출봉 광장</b><br><span id="count">접속 중…</span><br>이동: WASD/방향키 또는 바닥 터치·클릭</div>
<button id="nameBtn">이름 바꾸기</button>
<div id="chatlog"></div>
<form id="bar"><input id="chatInput" maxlength="120" placeholder="근처 사람들에게 말하기…" autocomplete="off"><button>보내기</button></form>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
